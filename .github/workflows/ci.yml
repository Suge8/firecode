name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 发布流程复用这些检查，ref 是要检查的 tag。
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

concurrency:
  # 发布流程在 main 上手动触发时 github.ref 也是 main，不带 inputs.ref 会互相取消。
  group: ci-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      # pi 源码与版本见 scripts/pi-source.ts；测试、类型检查和 pi-smoke 都从默认缓存目录找到它。
      - name: Set up dev environment
        run: bun run setup

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
