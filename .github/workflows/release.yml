name: Release

# GitHub Release 发布时自动发布到 npm；workflow_dispatch 用于补发已存在的 tag。
# 用 npm Trusted Publishing（OIDC），仓库里没有 npm 令牌；provenance 由 npm 自动附上。
# npmjs.com 上的一次性配置见 .github/CONTRIBUTING.md。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的已有 tag，例如 v1.3.1
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.event.release.tag_name }}

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing 需要
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Trusted Publishing 要求 npm ≥ 11.5.1、Node ≥ 22.14；Node 24 自带的 npm 满足。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG 与 package.json 的版本 v$version 不一致" >&2
            exit 1
          fi

      # npm publish 会先跑 prepack（bun scripts/build.ts）重新构建 dist。
      - name: Publish
        run: npm publish
