<title>FireCode</title>
<style>
  :root {
    --bg: #F2EFE6;
    --surface: #E7E3D5;
    --card: #FBFAF4;
    --ink: #20261F;
    --ink-soft: #71766B;
    --line: rgba(32, 38, 31, .1);
    --accent: #3E7A5E;
    --accent-deep: #2C5E47;
    --paper: var(--card);
    --paper-hi: var(--card);
    --mono: ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace;
    --sans: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    --serif: "Georgia", "Songti SC", serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 12.5px/1.65 var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ic { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.1;
        stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -2px; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
  .brand img, .brand svg.logo { width: 28px; height: 28px; }
  .brand .k { display: none; }
  .brand .v { font: 700 15px var(--serif); white-space: nowrap; }
  .statbar {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 7px 14px;
  }
  .statbar .stat { display: flex; align-items: center; gap: 6px; }
  .statbar .stat .ic { width: 12px; height: 12px; color: var(--accent-deep); }
  .statbar .k { font-size: 11px; color: var(--ink-soft); }
  .statbar .v { font: 700 12.5px var(--mono); white-space: nowrap; }
  .statbar .sep { width: 1px; height: 14px; background: var(--line); }
  header .spacer { flex: 1; }
  header button {
    display: flex; align-items: center; gap: 6px;
    font: 600 12px var(--sans); cursor: pointer; border-radius: 10px;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 7px 14px;
    transition: background .15s, color .15s;
  }
  header button.primary { background: var(--accent); color: #FFF; border-color: transparent; }
  header button.primary:hover { background: var(--accent-deep); }
  header button:not(.primary):hover { background: var(--surface); }
  main { flex: 1; display: flex; min-height: 0; gap: 10px; padding: 10px 12px 12px; }
  nav, #stage, aside {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  }
  nav {
    width: clamp(195px, 15vw, 235px);
    overflow-y: auto; padding: 8px 8px 20px; flex-shrink: 0;
  }
  nav .filter { position: sticky; top: 0; background: var(--card); padding: 2px 2px 8px; z-index: 2; }
  nav .filter input {
    width: 100%; font: 12px var(--sans); padding: 6px 10px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none;
  }
  nav .filter input:focus { border-color: var(--accent); }
  nav .grp {
    display: flex; align-items: center; gap: 7px;
    font: 700 10.5px var(--mono); letter-spacing: .1em;
    margin: 12px 4px 4px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  nav .grp .ct { margin-left: auto; font-weight: 400; letter-spacing: 0; }
  nav .grp .chev { transition: transform .15s; font-size: 9px; }
  nav .grp.closed .chev { transform: rotate(-90deg); }
  nav .grpbody.closed { display: none; }
  nav .item {
    display: flex; gap: 8px; align-items: center; padding: 5.5px 9px; margin: 2px 0;
    cursor: pointer; border-radius: 8px; line-height: 1.4;
  }
  nav .item:hover { background: var(--surface); }
  nav .item.sel { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent-deep); }
  nav .item.hid { display: none; }
  nav .item.dm { opacity: .35; }
  nav .code {
    font: 700 10.5px var(--mono); border: 1px solid var(--line); border-radius: 5px;
    padding: 0 4px; min-width: 26px; text-align: center; background: var(--bg); flex-shrink: 0;
  }
  nav .nm { font-size: 12.5px; }
  nav .ct { margin-left: auto; font-size: 11px; color: var(--ink-soft); }
  #stage { flex: 1; position: relative; min-width: 0; cursor: grab; overflow: hidden; }
  #stage.panning { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #flowbar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 3px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 3px; z-index: 5; max-width: 86%; overflow-x: auto;
    box-shadow: 0 2px 10px rgba(20, 20, 19, .06);
  }
  #flowbar button {
    font: 600 11.5px var(--sans); border: 1px solid transparent; background: none;
    color: var(--ink-soft); padding: 5px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  #flowbar button.on { background: var(--accent); color: #FFF; }
  aside {
    width: clamp(295px, 24vw, 355px);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .tabs { display: flex; gap: 4px; margin: 10px 12px 0; background: var(--surface); border-radius: 11px; padding: 3px; }
  .tabs button {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    font: 600 12.5px var(--sans); padding: 7px 0; border-radius: 8px;
    background: none; color: var(--ink-soft); border: 1px solid transparent; cursor: pointer;
  }
  .tabs button.on { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  #panel { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }
  #panel .kicker {
    display: flex; align-items: center; gap: 7px;
    font-size: 10.5px; letter-spacing: .15em; color: var(--ink-soft);
  }
  #panel h2 { font: 700 18px/1.4 var(--serif); margin: 6px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 9px; }
  #panel h3 { font-size: 11px; letter-spacing: .13em; color: var(--ink-soft); margin: 18px 0 7px; }
  #panel p { font: 13.5px/1.75 var(--sans); margin-bottom: 11px; }
  #panel mark { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent-deep); padding: 0 4px; border-radius: 4px; font-weight: 700; }
  #panel ul { list-style: none; padding: 0; }
  #panel li { font-size: 12px; margin: 4px 0; }
  #panel li.src { display: flex; align-items: baseline; gap: 6px; }
  #panel li.src code, #panel .src code { word-break: break-all; }
  #panel code { font: 11.5px var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  #panel .src { cursor: pointer; }
  #panel .src:hover code { border-color: var(--accent); color: var(--accent-deep); }
  #panel .steps li { cursor: pointer; padding: 3px 0; font-size: 12.5px; }
  #panel .steps li:hover { color: var(--accent-deep); }
  #panel .steps li.done { color: var(--ink-soft); }
  #panel .steps li.now { color: var(--accent-deep); font-weight: 700; }
  #panel .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 6px; }
  #panel .chip {
    font: 600 11px var(--sans); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 9px; cursor: pointer;
  }
  #panel .chip:hover { border-color: var(--accent); color: var(--accent-deep); }
  #panel .dimtext { color: var(--ink-soft); font-size: 12px; }
  #panel .md-body h1 { font: 700 15px/1.5 var(--serif); margin: 16px 0 8px; }
  #panel .md-body h2 { font: 700 13.5px/1.5 var(--serif); margin: 14px 0 7px; border: none; padding: 0; }
  #panel .md-body h3, #panel .md-body h4 { font: 700 12px var(--sans); letter-spacing: 0; color: var(--ink); margin: 12px 0 6px; }
  #panel .md-body pre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 0 0 11px; }
  #panel .md-body pre code { border: none; background: none; padding: 0; font-size: 11px; line-height: 1.6; display: block; }
  #panel .md-body ul { list-style: disc; padding-left: 18px; margin-bottom: 11px; }
  #panel .md-body ol { padding-left: 18px; margin-bottom: 11px; }
  #panel .md-body li { font: 12.5px/1.7 var(--sans); margin: 3px 0; }
  #panel .md-body table { border-collapse: collapse; margin: 0 0 12px; width: 100%; }
  #panel .md-body th, #panel .md-body td { border: 1px solid var(--line); padding: 4px 8px; font-size: 11.5px; text-align: left; }
  #panel .md-body th { background: var(--surface); }
  #panel .md-body blockquote { border-left: 3px solid var(--accent); padding: 2px 10px; color: var(--ink-soft); margin: 0 0 11px; }
  #panel .md-body a { color: var(--accent-deep); }
  #panel .md-body hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  #panel .wl { cursor: pointer; text-decoration: underline dotted; }
  .b, .lk { transition: opacity .18s, transform .2s ease; cursor: pointer; }
  .b.dim, .lk.dim { opacity: .13; }
  #svg g.b:not([data-plate]):hover { transform: translateY(-3px); }
  #svg g.b.hop { animation: hop .5s ease; }
  @keyframes hop { 30% { transform: translateY(-7px); } 60% { transform: translateY(-1px); } }
  #selring { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) {
    #selring, #svg g.b.hop { animation: none; }
    #svg g.b:not([data-plate]):hover { transform: none; }
  }
  @media (max-width: 1080px) { nav { display: none; } }
  @media (max-width: 820px) { aside { display: none; } }
</style>

 "wiki": {
  "data-flow.md": "---\nsources:\n  - agent/extensions/firecode/index.ts 371b956bc12d loadConfig session_start\n  - agent/extensions/firecode/provider/openai-native/src/request-pipeline.ts ed2089566058 rewriteOpenAIProviderRequest replayOpenAINative applyOpenAIOptions\n  - agent/extensions/firecode/provider/claude-sub.ts 03508d39cc7e before_provider_request buildBillingHeader\n  - agent/extensions/firecode/review/index.ts f2a6f35f299d dispatch advanceWhenIdle setOccupancy\n  - agent/extensions/firecode/master/herdr.ts 1e145c952309 monitorSettlement handleSettlement autoReview\n  - agent/extensions/firecode/master/index.ts a292b31177f3 flushMasterEvents PENDING_EVENT_TYPE\n  - agent/extensions/firecode/statusbar/quota.ts 1d978210b0e5 refresh subscriptionProvider\n  - agent/extensions/firecode/session/bark.ts e76b3adf5dd4 buildBarkPayload hasBlockedWorker\n  - agent/extensions/firecode/session/presets.ts 1a9628dd591d applyPreset\n  - agent/extensions/firecode/session/stats.ts 253b5c7b8885 collect\n---\n\n# 数据流\n\nFireCode 是 pi 扩展，没有自己的进程；一切数据流都从四类入口进入：**斜杠命令**、**快捷键**、\n**宿主事件钩子**、**外部投递**。下面每个真实入口至少一条端到端路径。\n\n## 入口清单\n\n| 入口 | 类型 | 落点 |\n| --- | --- | --- |\n| `/fire-review` | 命令 | review 执行器（`review/index.ts`），Master 也从外部把这个字面量投进 Worker pane |\n| `/fire-master [off\\|status]` | 命令 | Master 激活/关闭/状态（`master/index.ts`） |\n| `/preset [名]`、`/rename`、`/tokens`、`/fast`、`/tool-status` | 命令 | presets / rename / stats / openai-native / tools 各自模块 |\n| `keys.rename`、`keys.cyclePreset`、预设自带 key、`keys.fast` | 快捷键 | 与同名命令同一路径（启动时绑定，改配置需重启） |\n| `before_provider_request` | 宿主钩子 | provider 两条请求改写路径 |\n| `session_before_compact` | 宿主钩子 | 原生压缩（关闭时返回 undefined 走宿主默认压缩） |\n| `session_start` / `resources_discover` | 宿主事件 | 装配告警、review checkpoint 恢复、Master reconcile、额度抓取 |\n| `agent_start` / `agent_end` / `agent_settled` / `message_end` | 宿主事件 | working-flame 挂撤、review 互锁与开审、bark 推送、状态栏重绘 |\n\n## 场景一：Master 委派与回传（/fire-master → subagents）\n\n`/fire-master` 激活后 Master 会话获得 `subagents` 工具 → `start` 经 `master/herdr.ts` 在\nherdr 里 split pane（2×2 象限）、临时 ZDOTDIR 挂 precmd 标记等真实 shell 就绪、`agent start`\n拉起 Worker（独立 pi 进程，带 `FIRECODE_MASTER_WORKER`，busy 退避重试 15s）→ 每次状态变化经\n`master/state.ts` 原子落盘（v5、0600）→ `monitorSettlement` 无截止等待落定 →\n`handleSettlement` 分流：带 `REVIEW_OCCUPANCY_LABEL` 的 blocked 转 reviewing、其余 blocked\n回传提问、`stop` 成功回传、中断走续监与五分钟自动续跑提醒 → 声明 `review:true` 的成功落定由\n`autoReview` 投递字面 `/fire-review` 到 Worker pane（进入场景二）→ 终态经 `readReviewOutcome`\n读回 → 回传统一走收件箱：入队即以 `PENDING_EVENT_TYPE` 落 Master 会话，`flushMasterEvents`\n在回合边界合并成一条 follow-up 投递，投成写 ack，reload 后 pending−ack 差集重投。\n\n## 场景二：对抗性审查循环（/fire-review）\n\n命令进入 `review/index.ts` 执行器 → 事件经 `dispatch()` 串行灌入 `review/state.ts` 的\n`reduce()`，返回新状态 + effect → `advanceWhenIdle()` 过 idle 门后按配置清单 spawn 审查者\n子进程（`review/process.ts`，`pi --mode json`，排除 write/edit，stdout 按行增量消费）→\n每票 `REVIEWER_SETTLED` 回灌聚合（error 票判整轮 error、FAIL 进修复相、全 PASS 经总结相落\nsettled）→ FAIL 发现投回执行模型修复（`agent_start`/`agent_end` 回执确认），连续失败达阈值\n咨询顾问 → 全程每次迁移写 checkpoint（`review/checkpoint.ts`，runId+seq CAS 防双运行时）、\n发结果卡、`setOccupancy` 双通道发布占用（进程内 `herdr:blocked` 频道 + herdr-client 直投\n`state_labels.blocked` TTL 租约）。终态由外部经 `review/outcome.ts` 只读解析。\n\n## 场景三：模型请求改写（before_provider_request / session_before_compact）\n\n每次模型请求经 `before_provider_request`：Anthropic OAuth 会话由 `provider/claude-sub.ts`\n判定 `shouldApply` 后返回新 payload（system 首位插 `buildBillingHeader` 归因块，API Key 会话\n原样通过）；OpenAI/xAI 由 `request-pipeline.ts` 两步顺序改写——先在开启原生压缩时\n`replayOpenAINative` 用 `compactedWindow` 替换压缩点前的 input（重算期望 payload 深比较，\n不一致即放弃改写），再 `applyOpenAIOptions` 写 `text.verbosity` 与 `service_tier: \"priority\"`。\n压缩本体走 `session_before_compact`（`native-compaction.ts`）：触发取材 → 直调 Responses API\n`compaction_trigger` → 压缩条目连同身份四元组落会话 jsonl，供 replay 读回。\n\n## 场景四：会话外围联动（宿主事件驱动）\n\n- **额度**：`session_start` / `model_select` / `agent_end` 触发 `statusbar/quota.ts` 的\n  `refresh` → `subscriptionProvider` 判定订阅制供应商 → 抓各家用量接口 → 结果与 1/2/5 分钟\n  退避写 `~/.pi/agent/tmp/firecode-quota-<provider>.json` 跨会话共享 → 状态栏重绘。\n- **落定通知**：`agent_settled` 且 idle 时 `session/bark.ts` 的 `buildBarkPayload` 组通知 →\n  `hasBlockedWorker` 只读 Master 状态文件，有待拍板升 timeSensitive → 推 Bark APNs。\n- **身份投影**：`session_info_changed` / `model_select` 等 → `session/herdr-display.ts` 串行经\n  herdr-client 写 pane 副标题，送达确认才记已发布。\n- **工作火焰**：`agent_start`/`agent_end` 挂撤 widget，订阅 `herdr:blocked` 在审查活跃期退让。\n\n## 命令小径（不成场景的短路径）\n\n`/preset` → `applyPreset` 快照当前状态后切模型/工具/附加指令（附加指令在 `before_agent_start`\n拼进 systemPrompt）；`/rename` → 清洗后 `setSessionName`，显示投影由 herdr-display 事件承接；\n`/tokens` → `collect` 扫 `sessions/*.jsonl` 按 `usageAttribution` 归因输出 Markdown 表；\n`/fast` → 文件锁内只替换 config.jsonc 的 openai 节文本，原子覆盖立即生效；\n`/tool-status` → 列出已加载/已启用工具。\n\n## 启动装配（所有入口的前置）\n\npi 加载扩展 → `index.ts` 默认导出执行 `loadConfig()`（读插件目录 config.jsonc，产出\n`{ config, problems }`）→ 按 `features` 逐个 `registerX(pi)`；herdr 投影与 review 卡渲染/\ncheckpoint 收口无条件注册。配置问题不阻断装配，`session_start` 逐条 notify，由各功能自行\n决定拒绝启动（review/master 命中问题即拒绝）。\n",
  "index.md": "---\nbaseline: a72d6f8f40191ca1ef353d1436dcf121aa28b203\nsources:\n  - agent/extensions/firecode/index.ts 371b956bc12d REGISTRARS\n---\n\n# FireCode 架构 Wiki\n\npi 的个人定制扩展层。代码是事实源，本 wiki 是持续维护的压缩理解；\n每页 frontmatter 记录来源文件哈希，`node docs/architecture/verify.mjs` 做过期检查。\n\n## 导航\n\n- [系统总览](system.md)——模块地图、五条跨模块接缝、设计不变量\n- [数据流](data-flow.md)——启动装配、请求改写、审查循环、Master 委派、辅助流\n\n### 模块页\n\n- [入口与共享基座](modules/core.md)——index.ts 装配、config.ts 配置事实源、共享工具\n- [状态栏](modules/statusbar.md)——底部两行渲染、订阅额度抓取与缓存退避\n- [工具行渲染](modules/tools.md)——默认 4 工具单行化、连续轨道、宿主原型 patch\n- [会话功能](modules/session.md)——预设、改名、/tokens、Bark、herdr 投影、工作火焰\n- [Provider 请求层](modules/provider.md)——Claude 归因、verbosity/加速档、原生压缩\n- [对抗性审查](modules/review.md)——reducer/执行器分层、状态机、checkpoint、占用信号\n- [Master 主控](modules/master.md)——subagents 工具、Worker 生命周期、事件投递\n\n## 维护\n\n同步流程见仓库 `~/.agents/skills/development/architecture-wiki/SKILL.md`：\n代码变更后按 baseline diff 定位受影响页面，改正文或刷哈希，重渲染 `architecture.html`。\n",
  "system.md": "---\nsources:\n  - agent/extensions/firecode/index.ts 371b956bc12d REGISTRARS registerReview registerMaster registerHerdrDisplay\n  - agent/extensions/firecode/config.ts 17512757882e loadConfig FEATURES parseReviewConfig parseMasterConfig\n  - agent/extensions/firecode/review/outcome.ts 390ab5ea36a2 readReviewOutcome REVIEW_OCCUPANCY_LABEL\n  - agent/extensions/firecode/master/state.ts e51063b2f460 loadMasterState masterStatePath\n  - agent/extensions/firecode/tools/line.ts cd6bca3c9b27 ToolLine makeResultRenderer\n---\n\n# 系统总览\n\nFireCode 是 pi 的个人定制扩展，单一入口 `index.ts` 按 `config.jsonc` 的 `features` 开关逐个调\n`registerX(pi)` 装配十余个彼此封闭的功能模块。没有中央运行时、没有共享事件总线：每个 register\n把自己的状态关在闭包里，关掉任何一个不影响其余。配置的唯一事实源是 [config.ts](modules/core.md)，\n校验姿态是「类型错误记录为 problem、review/master 节命中问题即拒绝启动而非静默回退」。\n\n## 模块地图\n\n| 模块页 | 覆盖 | 一句话职责 |\n| --- | --- | --- |\n| [入口与共享基座](modules/core.md) | index.ts、config.ts、header.ts、format/theme/flame-frames/herdr-client | 装配决策 + 无状态共享工具 |\n| [状态栏](modules/statusbar.md) | statusbar/ | 底部两行：位置/会话名/指挥官徽标 + 模型/额度/上下文/缓存/速度 |\n| [工具行渲染](modules/tools.md) | tools/ | 接管默认 4 工具的单行渲染与连续轨道 |\n| [会话功能](modules/session.md) | session/ | 预设、改名、/tokens、Bark 通知、herdr 身份投影、工作火焰 |\n| [Provider 请求层](modules/provider.md) | provider/ | Claude 归因头、OpenAI verbosity/加速档/原生压缩 |\n| [对抗性审查](modules/review.md) | review/ | /fire-review：多模型并行审 + 顾问仲裁 + checkpoint |\n| [Master 主控](modules/master.md) | master/ | /fire-master：subagents 工具管 Herdr Worker 生命周期 |\n\n## 跨模块接缝\n\n模块间的真实耦合只有五条，全部单向：\n\n1. **Master → review**：`master/herdr.ts` 只读调 `review/outcome.ts` 的 `readReviewOutcome`\n   读 Worker 审查终态，并用 `REVIEW_OCCUPANCY_LABEL` 区分审查占用与 Worker 提问。\n   checkpoint 格式仍归 review 所有，两者不交换运行身份。\n2. **bark → Master 状态**：`session/bark.ts` 经 `loadMasterState(masterStatePath(id))` 只读\n   Worker Pool 持久化文件判断有无待拍板子代理，读失败按无待拍板降级。\n3. **Master → tools 渲染**：`master/index.ts` 复用 `tools/line.ts` 的 `ToolLine` /\n   `makeResultRenderer` 纯组件画自己的 `subagents` 工具行。\n4. **review → working-flame（频道）**：review 在进程内 `herdr:blocked` 频道发布占用信号，\n   工作火焰据此在审查活跃期退让；消费方不反向依赖 review 状态。\n5. **review / provider / Master → statusbar（状态键）**：状态栏从宿主扩展状态表只读\n   `fire-review`（审查进度）、`pi-openai-native-fast`（加速档标记）与 `master`\n   （指挥官徽标，Master 按子代理状态计数写入，窄屏整段丢弃）三个键，键不存在时片段为空。\n\n其余共享全是无状态基座：`format.ts`（宽度/文本格式化）、`theme.ts`（阈值配色）、\n`flame-frames.ts`（火焰帧素材，review 活动框与工作火焰共用）、`herdr-client.ts`\n（herdr socket 短连接，身份投影与占用标签共用）。\n\n## 设计不变量\n\n- **单一状态事实源**：review 循环状态只在 `review/state.ts` 纯 reducer 中迁移，Worker Pool\n  只在 `master/state.ts` 的 v5 schema 文件中持久化；两者的执行器（`review/index.ts`、\n  `master/herdr.ts`）承担全部副作用。\n- **配置坏 ≠ 用户关闭**：review/master 节有问题时拒绝启动并保留 checkpoint，修好重启继续；\n  静默回退默认模型会拿用户没配的模型真实发起调用。\n- **宿主耦合收口**：碰 pi 内部实现的只有 `tools/grouping.ts`（组件树 + 原型 patch），\n  升级 pi 时优先检查这一处。\n- **纯函数可测**：`statusbar/render.ts`、`tools/line.ts`、`review/state.ts` 等纯函数层\n  被 `tests/` 直接覆盖，测试入口 `bun test agent/extensions/firecode/tests`。\n\n端到端运行路径见 [data-flow.md](data-flow.md)。\n",
  "modules/core.md": "---\nsources:\n  - agent/extensions/firecode/index.ts 371b956bc12d firecode REGISTRARS registerHeader registerHerdrDisplay registerReview registerMaster loadConfig\n  - agent/extensions/firecode/config.ts 17512757882e loadConfig FEATURES Feature FireCodeConfig LoadedConfig CONFIG_PATH parseJsonc parseReviewConfig parseMasterConfig DEFAULT_KEYS DEFAULT_MASTER_MODELS\n  - agent/extensions/firecode/format.ts 668b4e9de4dc oneLine clip formatTokens formatDuration formatModelName\n  - agent/extensions/firecode/theme.ts 485324b650f0 ANSI FLAME contextColor cacheColor quotaColor sizeColor thinkingColor\n  - agent/extensions/firecode/header.ts 1bd70c504b45 registerHeader\n  - agent/extensions/firecode/herdr-client.ts e6cf936c235e herdrPaneEnv herdrRequest\n  - agent/extensions/firecode/flame-frames.ts ace06ae44d00 flameFrameLines flameFrameWidth FLAME_FRAME_COUNT\n---\n\n# 入口与共享基座\n\n## 职责\n\n这一层负责两件事：把整个定制层装配起来，以及提供所有功能模块共用的底层能力。\n\n装配的规则很简单——读一次配置，按开关逐个启用功能，任何一个功能关掉都不影响其余。配置只有一份文件，读一次后缓存，解析时不静默纠正用户的错误：写错的开关名、写错类型的值、重复占用的快捷键、审查与子代理花名册里的未知字段都会被收集成问题清单，会话启动时以警告形式提示，而不是悄悄回退成默认值再拿默认模型发起真实调用。\n\n共享基座包括四类东西：把任意文本安全塞进单行 UI 的宽度与数值格式化、把数值阈值映射成颜色的品牌配色表、会话开头的火焰横幅、以及一套可任意缩放的火焰动画帧素材。此外还有一个与外部终端复用器通信的最小客户端，供身份投影和审查占用标签共用。它们都是无状态的纯能力，谁需要谁调用，不反向依赖任何功能模块。\n\n## 对外接口\n\n| 文件 | 对外交付 |\n| --- | --- |\n| `index.ts` | 默认导出 `firecode(pi)`，插件唯一入口 |\n| `config.ts` | `loadConfig()`（带缓存，返回 `config` 与 `problems`）、`FEATURES` / `Feature`、`CONFIG_PATH`、`parseJsonc`、`parseReviewConfig` / `parseMasterConfig`（导出供测试）、`DEFAULT_KEYS`、`DEFAULT_MASTER_MODELS` |\n| `format.ts` | `oneLine` `clip` `formatTokens` `formatDuration` `formatModelName` |\n| `theme.ts` | `ANSI` `FLAME` 与 `contextColor` `cacheColor` `quotaColor` `sizeColor` `thinkingColor` |\n| `header.ts` | `registerHeader(pi)` |\n| `herdr-client.ts` | `herdrPaneEnv()` `herdrRequest(source, method, params)` |\n| `flame-frames.ts` | `flameFrameLines(height, frameIndex)` `flameFrameWidth(height)` `FLAME_FRAME_COUNT` |\n\n`clip` 支持从头或从尾截断（`from: \"start\"` 保留尾部，用于路径），并接受自定义省略号——`header.ts` 的居中就用空省略号调用它。`herdrRequest` 返回是否送达：非受管环境、连接失败、超时（500ms）和响应带 error 一律为 `false`。\n\n## 数据怎么流\n\n启动时入口先读配置。配置里的功能开关按「省略即开启」解释，于是只有显式写 `false` 才会跳过某个功能；对应的注册函数拿到宿主 API 后各自订阅事件、注册命令和渲染器，彼此之间没有调用关系。\n\n有两处刻意偏离这个规则。终端复用器的身份投影没有开关，它总是被启用，因为它在复用器之外会自我禁用，且只写显示层。对抗审查则不是简单的开或关：无论开关如何，历史结果卡的渲染与检查点收口都必须注册，否则重开会话会看到空白卡、未完成的审查也无人收尾；开关只决定命令和执行循环是否可用。还有一种情况要区分——整节开关写成了非对象，这时所有功能会被安全地全部关闭，但这属于配置坏而不是用户主动关闭，入口会把这个区别告诉审查模块，让它不要把进行中的检查点当成用户放弃而封存。\n\n配置的问题清单不阻断启动。清单非空时，入口挂一个会话启动回调，把每条问题作为警告提示给用户；配置读取本身已缓存，同一进程内多次取用不会重复解析，也不会产生互相打架的第二份事实源。\n\n共享基座是被动的：状态栏、工具行、审查界面、子代理事件卡在渲染时向格式化与配色求值，横幅和工作火焰按当前终端宽高向火焰素材要对应尺寸的帧。配色表把所有阈值到颜色的判断收在一处，遵循「首个满足下限的档位胜出」；缓存命中率的方向与上下文填充相反，这类语义差异也表现在同一张表里，而不是散落在各个渲染点。\n\n## 改动指南\n\n新增一个功能模块时，在 `config.ts` 的 `FEATURES` 数组里加名字，再在 `index.ts` 的 `REGISTRARS` 表里加一行即可；`REGISTRARS` 的类型排除了 `review` 与 `master`，这两个不能塞进表里——`registerReview` 需要额外传入启用标志与「features 整节类型错误」标志，`registerMaster` 单独判断。\n\n配置解析的红线是「不静默回退」。`parseReviewConfig` 与 `parseMasterConfig` 对未知字段（含嵌套对象，走 `rejectUnknownKeys`）一律记录问题；改字段时记得同步 `REVIEW_KEYS` 白名单，漏改会让合法字段被报成未知。开关的类型校验也别去掉：写成字符串 `\"false\"` 时因为入口用 `!== false` 判断仍会启用，而启用审查意味着真实模型调用。同理，`features` 写成非对象时不能回退成 `{}`，因为 `{}` 在入口语义里正是「全部启用」。\n\n`parseJsonc` 是手写的注释剥离器，不支持尾逗号；配置文件里的注释是唯一用法文档，改配置结构时连注释一起改。\n\n带背景色的卡片里不要用 pi-tui 的 `TruncatedText` / `truncateToWidth`：它们的省略号带全量重置序列，会在截断点掐断外层背景色。单行截断一律走 `clip`，它按字素簇切分并用 `visibleWidth` 计宽，宽字符和 emoji 不会被劈开。\n\n`flame-frames.ts` 的缩放帧只缓存一个高度（`scaledFrameCache` 单槽）。同一时刻两处以不同高度交替取帧会不断重算，代价不高但不是零；真要并存多个尺寸，得先把缓存改成按高度分槽。\n\n`herdrRequest` 的失败是静默的，只以返回值表达送达与否。调用方必须自己决定重试或降级——审查占用标签就是靠定时续约兼作失败重试，因为对端没有「进程退出即清理」的接口。\n",
  "modules/master.md": "---\nsources:\n  - agent/extensions/firecode/master/herdr.ts 1e145c952309 HerdrWorkers start allocateWorker launchWorker abandonStart send interrupt review stop resume shutdown reconcile monitorSettlement handleSettlement handleReviewSettlement watchInterrupted armAutoResume autoReview splitPlan createShellReadyMarker workerShellEnv validateDelegationText DELEGATION_SKILL_WHITELIST resolveWorkerCwd displayName agentName startAgentProcess withPaneEvidence\n  - agent/extensions/firecode/master/index.ts a292b31177f3 registerMaster MASTER_TOOL PENDING_EVENT_TYPE EVENT_ACK_TYPE flushMasterEvents sweepDispositions enqueueMasterEvent unackedEvents activateMaster deactivate workerInstructions loadMasterModels reviewGateError masterGuidelines listMeta STATUS_WORD subagentsCallParts\n  - agent/extensions/firecode/master/state.ts e51063b2f460 MasterState WorkerRef WorkerStatus WorkerDisposition MasterStore reduceMaster restoreMasterState loadMasterState masterStatePath liveWorkers requireWorker isStatus\n  - agent/extensions/firecode/master/event-format.ts 8654a2c83e72 MASTER_EVENT_TYPE BODY_SECTIONS sectionLine masterEventDetails isValidMasterEventDetails\n  - agent/extensions/firecode/master/event-card.ts 6310bba8b667 registerMasterEventRenderer CompactTitle compactCard\n  - agent/extensions/firecode/review/outcome.ts 390ab5ea36a2 REVIEW_OCCUPANCY_LABEL readReviewOutcome ReviewOutcome\n---\n\n# Master 多 Agent 主控\n\n## 职责\n\nMaster 把一个 Pi 会话变成指挥官：它自己不写代码，而是把工作委派给运行在 Herdr 窗格里的独立 Pi\n进程（子代理），再把子代理的落定结果异步送回指挥官的对话。没有 Goal、没有任务板，也没有常驻调度器——\n何时委派、派给谁、派几个，全由模型依据提示词决定，本模块只负责把决定变成真实进程，并保证结果一定回来。\n\n默认休眠：普通 Pi 会话完全不带子代理能力，用户执行 `/fire-master` 后才追加这一件工具；激活要求会话本身\n跑在 Herdr 管理的窗格里，且选型表配置无误——配置有问题直接拒绝启动，因为拿错模型会真实烧掉一个子代理。\n\n子代理进程加载的是同一个插件，靠启动时注入的环境变量识别出「我是子代理」这一身份：拿不到指挥官工具，\n改为在系统提示里追加禁令段（不碰 Herdr、不 push、不装依赖、提交只带自己的路径），并把文件写入限制在\n当前 checkout 内。这层限制的定位是防误伤而非沙箱——子代理保留 bash，能自跑测试，也能绕开路径限制；\n真要物理隔离得上容器或只读挂载（ADR-0004）。\n\n## 对外接口\n\n`subagents` 是唯一接口（`master/index.ts` 的 `MASTER_TOOL`），action 集合 start / send / interrupt /\nreview / ack / list / sleep / kill，命名来历见\n[ADR-0007](../../../adr/0007-rename-disposition-actions-for-model-priors.md)。语义边界写在\n`master/herdr.ts`：`send` 只对 `idle` / `blocked` 放行，`working` 的出路是先 `interrupt`；`review` 只接受\n`idle`；`stop` 一条路径两种结局，`sleep` 留可唤醒的 dormant 引用、`kill` 除名不可回；`ack` 只消发落标记。\n`start` 参数含 `worker`（简短任务词，必填）、`model` / `thinking`（省略则继承当前会话）、`cwd`\n（绝对路径且必须已存在，由 `resolveWorkerCwd` 校验）、`session`（休眠名或会话文件路径）与 `review`\n审查意图。\n\n工具行渲染复用 [tools](tools.md) 的 `ToolLine` 与 `makeResultRenderer` 纯组件：`subagentsCallParts`\n产出「动词 + 目标 + 关键参数」一行；`list` 的结果另把池快照回写 `context.state.meta`（与 edit ±diff 同一\n行内后缀通道），空池显「空」，否则列名字与中文状态词，词表 `STATUS_WORD` 以\n`satisfies Record<WorkerStatus, string>` 绑定枚举。\n\n跨模块只读接缝两条：[session](session.md) 的 bark 用 `state.ts` 的 `loadMasterState` / `masterStatePath`\n读池状态判断有无 `blocked` 待拍板子代理；对 [review](review.md) 只用 `review/outcome.ts` 的\n`readReviewOutcome` 与 `REVIEW_OCCUPANCY_LABEL`，不交换运行身份。\n\n事件通道常量：`MASTER_EVENT_TYPE`（`event-format.ts`，回传消息的 customType）、`PENDING_EVENT_TYPE`\n与 `EVENT_ACK_TYPE`（`master/index.ts`，收件箱条目）。正文分节标记集中在 `BODY_SECTIONS`，`sectionLine`\n是产文侧唯一入口，`masterEventDetails` 按同一标记反向抽取每事件一行预览。`event-card.ts` 的\n`registerMasterEventRenderer` 无条件注册，`compactCard` 画紧凑行、ctrl+o 展开全文，details 校验失败或\n旧消息降级纯文本，渲染器永不抛异常。\n\n## 数据怎么流\n\n**启动**分两段。串行段负责解析身份（名字、模型、思考等级、工作目录）、按现有布局算出该切哪个窗格、\n建好 shell 并先写一条「启动中」占位；并行段做 shell 握手和真正拉起子代理进程。shell 创建必须留在串行段——\n后一个子代理的象限切分依赖前一个窗格已经落位，并发会互相拿错容量；握手和拉起放在串行段之外，首批工单\n才能真并行。布局是 2×2 象限切，每个 tab 最多住四个，住满或切分失败才新建 tab；单住时 tab 标签是子代理\n显示名，来了第二个改成组名。命名四层统一为「任务名-模型名」，Herdr 侧的 agent 名是它的字符集净化版。\n窗格命名纯属显示，失败只通知不影响启动。拉起子代理时若 Herdr 报窗格忙，会在十五秒窗口内退避重试，\n窗口用尽才失败，并附上窗格前台进程快照当证据。\n\n**落定回传**只有一条监听循环，工作与审查两种模式共用，监听失败按指数退避重挂，进程消失则转休眠或除名。\n工作模式下的分流：子代理报阻塞时，若状态标签是审查占用（比如用户在那个会话手动发起了对抗审查），说明它\n不是在提问，转成审查中继续等终态；否则才把问题回传给指挥官。回合结束时读子代理会话的最后一条回复判定\n结局——只有正常停止且无错误才按成功回传，长度超限、工具中断、错误、回复缺失一律按失败回传。中断是\n第三条路：既不算失败也不消耗审查意图，记下中断时刻后插件继续盯着，用户接手则结果照常回流，五分钟无人\n动手就发一条自动续跑提醒把决策交还指挥官（ADR-0006）。指令中断和用户手动中断走同一条结算路径，只是\n事件文案注明来源。\n\n**审查意图**在派发或追加任务时声明，跟着任务走而不是跟渠道走，随子代理档案持久化。成功落定后自动发起\n审查；意图只在确认审查真的启动时才算消耗——投递命令会要求观察到状态变化，观察不到就退而看审查运行号\n是否推进，两者都没有即判「审查未启动」并保留意图，reload、重连和休眠唤醒都能凭档案续上这次补审。审查\n期间拒绝发消息，避免追问撞进审查。审查终态从子代理会话的审查存档读出，连同最终回复一起回传；若读到的\n仍是进行中，说明占用信号短暂失效，退避后重新等待而不是草率结算。\n\n**结果投递**是至少一次语义的收件箱：事件先落进指挥官会话成为待投条目，投递成功再写一条确认；crash 或\nreload 之后取「待投减确认」的差集重投，重复投递无害。投递本身受回合边界约束——宿主一回合只收一条\n跟进消息，回合进行中到达的结果先攒着，回合结束合并成一条投出去；投递失败整批退回队列，定时自重试，只在\n首次失败时通知用户。落定类事件送达即给对应子代理挂上「待发落」标记，指挥官这一回合不做处置就在下个回合\n边界注入一次提醒，提醒后仍不处置则升级为用户通知收口，标记跨 reload 续期。事件只装增量，模型和会话路径\n这类静态身份进场时给一次，之后按需重查。\n\n**状态持久化**是一个纯 reducer 加薄封装，每次变更立刻整份原子覆盖写盘：先写权限受限的临时文件再重命名，\n路径按指挥官会话 id 派生到临时目录，不往 Pi 会话里追加快照。schema 只认第 5 版并逐字段校验（名字与会话\n路径都必须唯一、休眠者必须有会话路径、在线者必须有窗格与 tab），不认旧版也不做迁移。reload 时旧运行时\n零副作用退场：只中止在飞任务并等它们结束，不关窗格也不写状态，现场完整交给新运行时按档案重新认领、\n重挂监听（审查中、工作中、中断态、待补审各有恢复路径）。会话退出或显式关闭才做实体清理并清空状态文件。\n\n## 改动指南\n\n按改动类型选入口：工具参数、门禁与事件投递看 `master/index.ts`；子代理生命周期、布局、监听与结算看\n`master/herdr.ts`；持久化 schema 看 `master/state.ts`；事件文案分节看 `master/event-format.ts`，卡片渲染看\n`master/event-card.ts`。测试在 `tests/master-state.test.ts`、`tests/master-herdr-recovery.test.ts`、\n`tests/master-integration.test.ts`。\n\n常见坑：\n\n- **工具名不能带 herdr**：叫 `subagents` 是有意的，名字里出现 herdr 会把模型引向 CLI 逃生路径，直接\n  bash 起脱管子代理（实测夜跑事故根因，ADR-0005）。`masterGuidelines` 里另有硬禁令与收编流程，\n  改工具名或提示词时别把这条改回去。\n- **回合边界不能拿 isIdle 判**：宿主在 emit `agent_settled` 之前就置 idle，那个窗口里 `flushMasterEvents`\n  会把同一批结果拆成多个回合投出去。门槛必须是显式的 `turnActive` 位（`agent_start` 置位、\n  `agent_settled` 清位）。\n- **发落语义别弱化**：`sweepDispositions` 的提醒只此一次，之后升级用户通知就收口，活性归代码、决策归\n  模型。对没有待发落标记的非 idle 子代理调 `ack` 必须报错——把它误当暂停是真实事故（ADR-0007），\n  返回假成功会让指挥官以为子代理已停。\n- **中断不按失败回传**：`handleSettlement` 判到中断只写中断时刻并交给 `watchInterrupted`，不消耗审查\n  意图、不发失败事件；中断时刻是「中断态」的唯一标记，`send` 门禁的豁免和 `armAutoResume` 的剩余计时\n  都凭它，直到有人接手才清。改这里要同时想清楚 reload 重挂的行为。\n- **技能前缀白名单在代码不在提示词**：`validateDelegationText` 只放行 `DELEGATION_SKILL_WHITELIST` 里的\n  `/skill:tdd `，其余 `/skill:` `/skills:`（含拼写错误，静默失效比违规更糟）一律拒绝——提示词禁令实战\n  失效 26 次后才改为机制，别退回提示词约束。同类的投递前门禁还有 `reviewGateError`：审查关闭或配置有误\n  时拒绝 review action 与审查票派发，否则 `/fire-review` 会退化成子代理会话里的一句普通输入。\n- **改 `WorkerStatus` 要三处同步**：`state.ts` 的 `isStatus` 校验、`index.ts` 的 `STATUS_WORD`\n  （有 satisfies 编译期把守）、以及 bark 的待拍板判据（无编译期把守，状态注释里点名了这条耦合）。\n- **紧凑行截断只能用 `clip`**：`CompactTitle` 刻意不用 pi-tui 的 `TruncatedText`——后者省略号带全量重置\n  序列，会在截断点掐断事件卡背景色（上游拒修）。\n\n整体位置见[总览](../system.md)。\n",
  "modules/provider.md": "---\nsources:\n  - agent/extensions/firecode/provider/claude-sub.ts 03508d39cc7e registerClaudeSub before_provider_request PI_CLAUDE_CODE_VERSION\n  - agent/extensions/firecode/provider/openai-native/index.ts a678cad4eee9 registerOpenAINative\n  - agent/extensions/firecode/provider/openai-native/src/extension.ts ae8e5e0f857a openAINativeExtension VERBOSITY_FLAG session_before_compact\n  - agent/extensions/firecode/provider/openai-native/src/config.ts 65b3f6333305 loadOpenAINativeSettings togglePriority providerSettings TextVerbosity\n  - agent/extensions/firecode/provider/openai-native/src/options.ts 8cc7c3f66613 FAST_STATUS_KEY supportsFastMode fastModeEnabled applyOpenAIOptions\n  - agent/extensions/firecode/provider/openai-native/src/request-pipeline.ts ed2089566058 rewriteOpenAIProviderRequest\n  - agent/extensions/firecode/provider/openai-native/src/native-compaction.ts 3025e1abc3ae compactWithOpenAINative replayOpenAINative\n  - agent/extensions/firecode/provider/openai-native/src/compact-client.ts 9ebb92df1f02 executeNativeCompaction\n  - agent/extensions/firecode/provider/openai-native/src/native-details.ts 3271dd205847 NATIVE_COMPACTION_STRATEGY resolveLatestNativeCompaction isNativeCompactionDetails\n  - agent/extensions/firecode/provider/openai-native/src/native-replay.ts e754f172d8bb rewriteNativeResponsesPayload serializeLiveTailToResponsesInput\n  - agent/extensions/firecode/provider/openai-native/src/native-runtime.ts 2639c790f88e resolveNativeCompactionTarget resolveNativeCompactionRuntime\n---\n\n# Provider 请求层\n\n## 职责\n\n这是 FireCode 唯一在「请求即将发出去」那一刻动手的地方：模型和会话内容都已由宿主准备好，本层只在发出前按供应商补几样宿主不会补的东西，补完就退场。\n\n它管三件事。第一件是身份：用 Anthropic 订阅登录（OAuth）跑的会话，按 Claude Code 官方客户端的格式补上归因信息，否则这些请求在服务端不会被认成订阅用量。第二件是发挥档位：OpenAI 系可以指定回答的详略程度，OpenAI 与 xAI 可以整体切到加速通道，加速档是每个供应商各自记住的开关，底部状态栏会显示当前是否处于加速档。第三件是上下文压缩：默认走宿主自带的压缩；打开开关后改用 OpenAI 自己的压缩能力，把长会话交给服务端浓缩成一份紧凑窗口，之后每次请求都用这份窗口替换掉宿主重放的那段旧历史。\n\n三件事互不依赖，任何一件不满足条件都原样放行请求，不改写、不报错、不阻塞对话。压缩失败是唯一会打断动作的情况——此时它取消这次压缩并把原因告诉用户，而不是悄悄退回宿主压缩，因为两种压缩产出的会话结构不一样，静默换道会让后续重放对不上。\n\n## 对外接口\n\n两个注册入口，均由 `index.ts` 按 `config.features` 调用：\n\n- `registerClaudeSub`（`provider/claude-sub.ts`）：给 `anthropic` 注册固定的 `user-agent` / `x-app` 头，并在 `before_provider_request` 钩子里判断当前模型是否为 Anthropic + OAuth，是则在系统提示词块首插入一条 `x-anthropic-billing-header:` 文本块；已存在则原样返回。版本号取自本机 `claude --version`，可用 `PI_CLAUDE_CODE_VERSION`、`PI_CLAUDE_CODE_ENTRYPOINT`、`PI_CLAUDE_CODE_WORKLOAD` 覆盖，`PI_CLAUDE_OAUTH_LOG_FILE` 可落调试日志。\n- `registerOpenAINative`（`provider/openai-native/index.ts`）：把 FireCode 的 `config.jsonc` 路径与 `keys.fast` 传给 `openAINativeExtension`（`src/extension.ts`），后者装配全部 OpenAI 侧行为。\n\n`openAINativeExtension` 对宿主暴露：`--verbosity` 标志（`VERBOSITY_FLAG`）、`/fast` 命令与可配置快捷键（默认 `ctrl+f`），并挂 `session_start`、`model_select`、`session_before_compact`、`before_provider_request`、`session_shutdown` 五个钩子；状态栏槽位键是 `options.ts` 的 `FAST_STATUS_KEY`。\n\n内部分工：\n\n| 文件 | 关键导出 | 作用 |\n| --- | --- | --- |\n| `src/config.ts` | `loadOpenAINativeSettings` `togglePriority` `providerSettings` `TextVerbosity` | 读 `config.jsonc` 的 `openai` 节（`nativeCompaction` + `providers`），字段非法只记 warning 不抛；写回时加 pid 锁、只替换 `openai` 这一个对象再原子改名，保留其余注释 |\n| `src/options.ts` | `supportsFastMode` `fastModeEnabled` `applyOpenAIOptions` | 加速档能力判定（xAI 全支持，OpenAI Responses 限 `PRIORITY_MODEL_IDS` 白名单）；写 `text.verbosity`（仅 Responses API）与 `service_tier: \"priority\"` |\n| `src/request-pipeline.ts` | `rewriteOpenAIProviderRequest` | 请求改写的单一入口：先原生压缩重放，再套 verbosity / priority |\n| `src/native-compaction.ts` | `compactWithOpenAINative` `replayOpenAINative` | 压缩与重放两条流程的编排 |\n| `src/native-runtime.ts` | `resolveNativeCompactionTarget` `resolveNativeCompactionRuntime` | 供应商 / API / baseUrl / payload 形状校验，以及从 `modelRegistry.getApiKeyAndHeaders` 取凭据 |\n| `src/compact-client.ts` | `executeNativeCompaction` | 直接 `fetch` Responses 端点（`store:false`、`stream:true`、input 末尾追加 `compaction_trigger`），解析 JSON 或 SSE，产出压缩窗口 |\n| `src/native-details.ts` | `NATIVE_COMPACTION_STRATEGY` `isNativeCompactionDetails` `resolveLatestNativeCompaction` | 压缩 checkpoint 的结构定义、校验与「最近一次本策略压缩」的定位 |\n| `src/native-replay.ts` | `serializeLiveTailToResponsesInput` `rewriteNativeResponsesPayload` | 会话条目转 Responses input；核对宿主重放并替换其中的历史段 |\n| `src/responses-input.ts` | `serializeMessagesToCompactRequest` `serializeMessagesToResponsesInput` | Pi 会话消息到 Responses input 的转换器（Pi 未导出，本模块自持一份） |\n\n## 数据怎么流\n\nAnthropic 一侧只有一条直路：请求出发前检查当前模型是不是订阅登录的 Anthropic，是就把归因文本块放到系统提示词最前面，其中携带一个由首条用户消息几个固定位置的字符与版本号算出的短后缀。其余情况一律不动。\n\nOpenAI 一侧有两条流。\n\n**压缩流**在宿主准备压缩时启动。先确认当前模型确实是支持原生压缩的那类供应商并能拿到凭据，拿不到就取消压缩并提示。接着决定送什么给服务端：如果本会话此前已经做过一次同款压缩，就拿那次的紧凑窗口，再补上从那次之后新长出来的对话尾巴；如果从没压缩过，就把整段会话序列化后送出。服务端返回的结果里必须恰好有一份压缩产物，否则视为失败；成功则把这份产物连同「回收了哪些近期消息」一起写进会话的压缩记录，同时记下产出它的供应商、接口、模型和服务地址。\n\n**重放流**在此后每次请求出发时启动。它先找到最近一次压缩记录，并核对记录上的身份与当前模型完全一致——换了模型或换了服务地址就放弃改写，因为那份紧凑窗口属于另一个服务端。然后它按同样规则从会话重新拼一遍宿主应该发出的内容，与手上这份请求逐项比对：只有完全对得上，才敢把其中「压缩之前那段历史」整体换成紧凑窗口，保留前后的提示词外壳和压缩点之后的新对话。任何一处对不上就整体放弃改写，让原请求照常发出。这个比对是重放的安全阀：它把「宿主怎么组织上下文」这个假设变成每次都要现场验证的事实，宿主改了排布只会退化成不压缩，不会发出一份错位的上下文。\n\n改写完成后，同一条请求继续过详略与加速档：详略只写给 OpenAI Responses 接口，命令行标志优先于配置；加速档要求模型在支持名单里且该供应商的开关是开的，才写入优先通道字段。两者都只在值确实需要变化时才复制对象，否则原样返回，宿主据此判断是否有改写发生。\n\n加速档开关翻转时改的是配置文件本身：读、翻、只重写那一个配置节、写临时文件再原子改名，全程持有一把带进程号的锁，锁主进程已死则夺锁。所以状态是持久的，多个会话看到同一份。\n\n## 改动指南\n\n- **加速档模型白名单是硬编码的**：`options.ts` 里的 `PRIORITY_MODEL_IDS` 只列了几个 gpt-5.x id，xAI 则整体放行。新模型上线不改这里，`/fast` 会提示「当前模型不支持加速档」——这是最常见的\"功能失灵\"来源。\n- **verbosity 只对 Responses API 生效**：`applyOpenAIOptions` 显式跳过 xAI Completions，因为那边没有这个字段；给 xAI 配 `textVerbosity` 不会报错，只是无效。\n- **重放的比对是全等比对**：`rewriteNativeResponsesPayload` 用 `expected-pi-replay-mismatch` 兜底。升级 pi 后若原生压缩\"突然不生效\"，先看这个分支——宿主改了上下文拼装顺序即会静默退化。同理，压缩记录的身份四元组（provider/api/model/baseUrl）任一不符都会被 `resolveLatestNativeCompaction` 判为 mismatch。\n- **压缩失败必须显式取消**：`native-compaction.ts` 的失败路径返回 `{ cancel: true }` 而非 `undefined`。不要\"改成回退宿主压缩\"——宿主压缩写入的 details 不是本策略格式，之后的重放会一路 mismatch，等于永久关掉原生压缩且用户不知情。\n- **配置写回不能整文件重序列化**：`config.ts` 的 `replaceKeyedObject` 靠括号配对只替换 `openai` 节，为的是保住 `config.jsonc` 里的注释。改这里要同时想到单测场景——它也支持不带 `openai` 外壳的独立配置文件。\n- **配置错误只降级不阻断**：`loadOpenAINativeSettings` 把非法字段收成 warnings，`session_start` 只弹第一条。这与 review / master 节「配置有问题就拒绝启动」的策略相反，是有意的：这里的错配最多丢一个可选优化，不会拿错模型发起真实调用。\n- **Codex 的压缩请求头是手搓的**：`compact-client.ts` 绕过宿主 provider 层直接 `fetch`，自己补 `chatgpt-account-id`（从 access token 的 JWT claim 解出）、`originator`、`openai-beta`。宿主那边改了 Codex 鉴权方式，这里不会自动跟上。\n- **服务端返回同时支持 JSON 与 SSE**：`parseSseOutput` 在没有 `response.completed` 输出时会退回收集到的 `response.output_item.done` 项。放宽解析前先确认失败原因，`missing-compaction`（压缩产物不是恰好一份）和 `malformed-response` 是两类不同故障。\n- **测试**：`bun test agent/extensions/firecode/provider/openai-native`，用例在 `src/*.test.ts`（config / options / native-details / native-compaction / compact-client）与 `test/`（native-runtime、pi-smoke）。`claude-sub.ts` 无单测，改动需实跑一次 Anthropic OAuth 会话验证。\n",
  "modules/review.md": "---\nsources:\n  - agent/extensions/firecode/review/state.ts e31966837f1f reduce initialState ReviewState Phase ReviewEffect\n  - agent/extensions/firecode/review/index.ts f2a6f35f299d registerReview advanceWhenIdle persist setOccupancy\n  - agent/extensions/firecode/review/checkpoint.ts 7310bfa9cf8a isValidCheckpoint beginCheckpoint writeCheckpoint CheckpointConflictError CHECKPOINT_KEYS\n  - agent/extensions/firecode/review/card.ts 973e94148263 registerCardRenderer buildCard isValidCardDetails\n  - agent/extensions/firecode/review/ui.ts 3f740cf035f1 showActivity hideActivity lockEditor unlockEditor\n  - agent/extensions/firecode/review/progress.ts 7bea9b6188c8 applyProcessEvent settleProgress\n  - agent/extensions/firecode/review/outcome.ts 390ab5ea36a2 readReviewOutcome REVIEW_OCCUPANCY_LABEL\n  - agent/extensions/firecode/review/reviewer.ts 41b8e170867f parseReviewOutput passIssue failIssue reviewerArgs\n  - agent/extensions/firecode/review/advisor.ts 593d2673b179 parseAdvisorOutput\n  - agent/extensions/firecode/review/process.ts 7a85429b06c7 runPiProcess\n  - agent/extensions/firecode/review/prompt.ts 903045a0ca6e priorRoundsSection buildFixFeedback buildSummaryPrompt\n  - agent/extensions/firecode/review/evidence.ts 9e0ba27d2b70 buildEvidence\n---\n\n# review — 对抗性审查\n\n## 职责\n\n对当前会话已经做完的事做一场外部对抗性审查：同时请几个外部模型各自独立复核，只要有人判未通过，就把发现交回当前会话的执行模型去修，修完再审下一轮。连续未通过到阈值时请一个顾问模型仲裁，它可以让循环继续、收窄范围或直接叫停，防止无限拉锯。质量上有结论之后（通过、顾问叫停、轮数用尽）再让执行模型用人话收一次尾，把各轮修了什么、为什么过不了讲清楚。\n\n审查过程全程可见：底部状态栏一行、编辑器上方一块带火焰的活动框显示每个模型此刻在读什么、跑什么、用了多久，每轮结论以带背景色的结果卡进入会话记录。等模型结论时输入区被接管，随时可按 esc 取消。\n\n每一次状态变化都先写进会话记录里的一份快照再执行动作，所以重启、reload、恢复会话都能从中断处接着跑，而不会漏投一次修复反馈或凭空复活一场已经结束的审查。审查结果同时对外可读：指挥官在外部发起审查后，只凭这份快照判断这场审查最终是通过、被质量裁决终止还是根本没跑完。\n\n审查者被排除了写入与编辑两个工具，但保留了执行命令的能力——它需要真的跑测试取证。这是契约不是沙箱：真要物理隔离得上容器或只读挂载。\n\n## 对外接口\n\n- `registerReview(pi, enabled, configBroken)`（`review/index.ts`）是唯一入口，注册 `/fire-review` 命令与全部宿主事件。功能关闭时它仍然注册结果卡渲染器（`registerCardRenderer`），历史卡片 reload 后外观不变；只有用户明确关闭才顺手封存仍处活动态的旧快照，配置坏掉不算关闭。\n- `readReviewOutcome(sessionPath)`（`review/outcome.ts`）是外部读取终态的唯一入口，只读解析会话文件里最近一条快照，返回 passed / stopped / failed / in_progress / none / error。同文件的 `REVIEW_OCCUPANCY_LABEL` 是审查活跃期对外广播的占用标签文本，Master 靠它把「审查占用」和「子代理真在提问」区分开。checkpoint 的格式仍归本模块所有，外部只准经这个函数读。\n- `reduce(state, event, limits, now)` 与 `initialState(runId)`（`review/state.ts`）是纯函数，零 IO，测试直接驱动整条循环。`ReviewEffect` 只有两种：发一张卡、请求推进。\n- `buildCard` / `isValidCardDetails`（`review/card.ts`）、`showActivity` / `hideActivity` / `lockEditor` / `unlockEditor`（`review/ui.ts`）是渲染侧接口，都只吃执行器传入的快照，自己不持状态。\n\n## 数据怎么流\n\n用户敲下命令后并不立刻开审：执行模型还在跑就先进排队相，等到宿主真正空闲的边界才开始第一轮。所有会启动工作的动作都走这道空闲门，另有一道硬互锁——只要执行模型要开始新回合，先中止审查子进程并等它们真正退出。\n\n开审那一刻取一次会话快照组装证据。首条用户消息是原始需求锚点，固定保留不参与预算竞争，其余消息按 token 预算从最新往回收；助手消息带上工具调用轨迹（做过什么、哪些调用失败了），审查者据此判断这次会话到底改了什么，共享目录里无法归因的改动不立案。本模块自己发的卡片与反馈消息被排除在证据外，避免自指。\n\n每个审查者是一个独立子进程，输出是逐行 JSON 事件流：事件一边被增量消费成活动框上的实时进度（当前在读哪个文件、跑什么命令、已多少次调用、各自耗时），一边被留到最后取回复正文。正文按输出契约解析：第一行必须是通过或未通过；通过必须带一行摘要加一条同时含文件和命令的证据锚点；未通过的每条发现必须六要素齐全。不合契约的票整票作废，记为基础设施错误而不是质量结论。\n\n一轮里所有审查者都落定后才汇总：只要有真实的基础设施错误就整轮判异常，不会把没形成的审查误报成未通过；有人判未通过则整轮未通过，反馈只带未通过的那几票，归档保留全部原文。\n\n未通过之后分两条路。连续未通过还没到顾问阈值，直接进入修复相：把发现连同「先核实再修、修根因、修完直接结束」的指令投给执行模型，输入区交还用户；回合确认结束才允许进入下一轮。到阈值则先发一张可见的失败卡，再起顾问子进程，裁决继续就补一张顾问卡进修复相，裁决收窄则修复指令改成「只修顾问圈定范围」，裁决停止就直接终止——终止卡只写顾问裁决，不再复制一遍已经展示过的发现。第二轮起，往轮发现连同顾问裁决一起注入新一轮提示，被仲裁掉的事项不允许原样重提，这是循环收敛的闭环。\n\n通过、顾问叫停、轮数用尽这三种质量裁决终态，都先经总结相：结果卡照发，再投一条带反循环禁令的总结提示触发一个可见回合，回合结束才算真正落定。取消、超时、基础设施错误这类事故终态直接落定，不浪费一个回合。\n\n持久化贯穿始终：每次状态迁移先落盘、落盘成功才继续执行副作用，写失败就地停掉这场审查并尽力补一条终态，绝不带着不一致的状态继续起子进程或投反馈。恢复时重投尚未确认启动的修复或总结回合——宿主发消息没有返回值，只能靠回合真的开始作为回执。会话离开当前运行时（reload / 新建 / 恢复 / fork）保留快照由新运行时接手，只有退出才写终态。\n\n审查活跃期对外发两路占用信号：一路进程内广播驱动终端复用器集成的阻塞状态，一路直接把标签写进 pane 元数据——实测只有后者能同时到达指挥官的判定逻辑和侧边栏文本。标签是带有效期的租约，持有期间定时续约，进程崩了也会自己过期，不会把子代理的真提问永久误判成审查占用。占用一直持有到总结完成，指挥官因此能把总结当作最终回复捕获。\n\n## 改动指南\n\n- 循环状态只经 `reduce()` 迁移，`review/index.ts` 是唯一执行器（起子进程、发卡、投反馈、落盘、状态栏）。别在别处存循环状态：模块级只有一个 controller，reload 会整体替换它。\n- checkpoint 的键白名单（`review/checkpoint.ts` 里 `CHECKPOINT_KEYS` 等常量）由领域类型 `satisfies` 派生：往 `ReviewState` 增删字段而不同步这里会直接编译失败。这是手写校验漂移的唯一防线——历史事故是终态写不进去，重启后恢复出幽灵审查。schema 只认当前版本，不做字段级兼容。\n- 首写走 `beginCheckpoint`（无条件替换旧终态），后续写走 `writeCheckpoint` 的 CAS；期望凭证由执行器自己记着，出现不是自己写的 runId 或 seq 就抛 `CheckpointConflictError` 并停审。\n- 带背景的结果卡里禁用 pi-tui 的 `TruncatedText` / `truncateToWidth`：其省略号带全量重置序列，会在截断点掐断外层背景色。单行截断一律用 `format.ts` 的 `clip`。活动框（`review/ui.ts`）不带背景，可以继续用宿主截断。\n- 结果卡渲染器永不抛异常：`isValidCardDetails` 不过就降级渲染纯文本。pi 对抛异常的渲染器会静默回落默认框，表现和没注册一样，必须从源头避免。\n- 占用标签是租约，不是一次性广播。改 `setOccupancy` 相关逻辑时保留定时续约与清除重试：herdr 没有「进程退出即清元数据」的接口，没有 TTL 的残留标签会让 Master 长期误判。\n- 按键必须经 keybindings 匹配，不能只比裸 `\\x1b`：终端开启增强键盘协议后 esc 是带修饰的序列，字面量比较会漏。\n- 输出契约的事实源是 `review/prompts/review.{zh,en}.md`；`parseReviewOutput`、`passIssue`、`failIssue`（`review/reviewer.ts`）与 `parseAdvisorOutput`（`review/advisor.ts`）是它的执行侧。改提示词必须同步这几个校验，反之亦然。校验容忍旧措辞与非粗体包裹，但不容忍要素缺失。\n- 子进程 stdout 必须按行增量消费（`runPiProcess`）：旧实现套用 stderr 的尾部截断，会把最后一条事件的行首切掉，长输出被误判为空。\n- 实时进度（`applyProcessEvent` / `settleProgress`）是纯 UI 态，不入 checkpoint：它每次工具调用都变，持久化只会放大写入，重启后由状态骨架重建即可。\n- 提示词组装集中在 `review/prompt.ts`：`priorRoundsSection` 负责往轮发现与顾问裁决注入，`buildFixFeedback` 区分继续与收窄两种指令，`buildSummaryPrompt` 携带反循环禁令。这些是纯函数，行为改动要能被单测钉住。\n- 证据组装（`buildEvidence`）改动时守住两点：首条用户消息不参与预算竞争；失败的工具调用要标注，无结果的调用不标——把真实编辑误标成未完成会反向制造假通过。\n- 配置有任何问题时命令与恢复都必须拒绝启动，不允许静默回退默认模型：那会拿用户没配的模型真实发起付费调用。活动快照保持原样，修好配置重启后继续恢复。\n- 相关测试：`tests/review-state.test.ts`（reducer 循环）、`review-contract.test.ts`（输出契约）、`review-integration.test.ts`（执行器编排）、`review-ui.test.ts`、`review-card-checkpoint.test.ts`、`review-outcome.test.ts`、`review-process.test.ts`。\n",
  "modules/session.md": "---\nsources:\n  - agent/extensions/firecode/session/presets.ts 1a9628dd591d registerPresets\n  - agent/extensions/firecode/session/rename.ts d03ae87c4332 registerSessionName\n  - agent/extensions/firecode/session/stats.ts 253b5c7b8885 registerStats usageAttribution parseDays\n  - agent/extensions/firecode/session/bark.ts e76b3adf5dd4 registerBark buildBarkPayload hasBlockedWorker\n  - agent/extensions/firecode/session/herdr-display.ts 227d461fb9f9 registerHerdrDisplay projectIdentity\n  - agent/extensions/firecode/session/working-flame.ts 672d8466be37 registerWorkingFlame flameHeightFor flameFitHeight\n---\n\n# session：会话功能\n\n## 职责\n\n围绕「一次 pi 会话」本身提供六件互不依赖的小功能：一键切换工作档位（模型、思考等级、可用工具、附加指令），给会话改名，统计历史会话的 token 用量与花费，任务落定后把结论推到手机通知栏，把当前会话的身份显示到外部终端复用器的侧边栏，以及在模型工作期间用一团燃烧的火焰代替宿主默认的等待提示。\n\n这六件事共用的只有「会话」这个语境，彼此没有调用关系：关掉任何一件，其余照常工作。它们统一属于旁路增强——推送失败、外部显示失败、统计文件读不动都不会打断正在进行的对话，失败一律静默或降级。\n\n对外的两处只读依赖：手机通知需要知道有没有子代理正等着拍板，因此读一眼子代理池的持久化状态；火焰需要在对抗审查活跃期让位给审查活动条，因此监听审查发出的占用信号。两处都是单向读取，不回写。\n\n## 对外接口\n\n每个文件导出一个 `registerX(pi)`，由 `index.ts` 按 `config.features` 逐个装配。\n\n| 文件 | 导出 | 用户入口 |\n| --- | --- | --- |\n| `session/presets.ts` | `registerPresets` | `--preset <名>`、`/preset [名]`、每个预设自己的快捷键、`keys.cyclePreset` 轮切 |\n| `session/rename.ts` | `registerSessionName` | `/rename <新名字>`、`keys.rename` 弹输入框 |\n| `session/stats.ts` | `registerStats`、`usageAttribution`、`parseDays` | `/tokens [天数]`，`0` 表示全部历史，默认 30 天 |\n| `session/bark.ts` | `registerBark`、`buildBarkPayload`、`hasBlockedWorker` | 无命令；靠 `~/.pi/agent/bark-key` 是否存在启停 |\n| `session/herdr-display.ts` | `registerHerdrDisplay`、`projectIdentity` | 无命令；herdr 内自动生效 |\n| `session/working-flame.ts` | `registerWorkingFlame`、`flameHeightFor`、`flameFitHeight` | 无命令；工作回合内自动出现 |\n\n纯函数是测试的抓手，也是可被复用的部分：`usageAttribution` 决定一条会话记录算到哪个模型头上，`parseDays` 解析 `/tokens` 参数，`buildBarkPayload` 组装推送体，`hasBlockedWorker` 做只读旁路判定，`projectIdentity` 拼身份字符串，`flameHeightFor` / `flameFitHeight` 算火焰高度。对应测试为 `tests/presets.test.ts`、`tests/rename.test.ts`、`tests/stats.test.ts`、`tests/bark.test.ts`、`tests/herdr-display.test.ts`、`tests/working-flame.test.ts`。\n\n配置只来自 `firecode/config.jsonc`：预设定义在 `presets` 节，两个快捷键在 `keys` 节（`session/presets.ts`、`session/rename.ts` 各自 `loadConfig()`）。\n\n## 数据怎么流\n\n**预设**在会话启动时读配置拿到预设表。带命令行参数时立即套用；否则只从会话记录里捞回上次用的预设名，恢复名字与附加指令，不重放模型和工具切换——历史里的模型此刻可能已不可用，重放会在启动阶段抛出用户没要求的副作用。首次套用前会给当时的模型、思考等级和工具集拍一张快照，\"清除预设\"就是把快照放回去。附加指令不写进配置文件里的系统提示，而是在每次请求组装系统提示时追加到末尾。每个回合开始时把当前预设名写进会话记录，这就是下次恢复的来源。未知的模型或工具只警告不阻断，能套用多少套多少。\n\n**改名**把用户输入清洗后（去控制字符与不可见字符、压缩空白、限长）交给宿主，只改会话名，不碰任何外部持久名称。\n\n**统计**递归扫会话目录下所有 jsonl，逐行判定归属：助手消息算到\"提供方/模型\"并计一次请求，工具结果与压缩记录统一归到一个\"工具与摘要\"的伪模型且不计请求数，其余行忽略。时间过滤按记录自带的时间戳，没有时间戳的记录不会被排除掉。单个文件读失败或单行解析失败都跳过继续，最后汇总成 Markdown 表格；有界面时弹卡片，无界面时直接打印。\n\n**通知**在每轮消息里记住最后一段助手正文，等到本轮彻底落定且宿主确认已进入空闲才推送。标题优先用会话名，没有才退到工作目录名——直接在家目录跑时目录名恰好是用户名，不适合当标题。同一会话固定用会话 id 作通知 id，新通知会顶掉旧的，通知栏每会话只留一条。此时读一眼子代理池状态，若有子代理处于阻塞待答状态，就加\"待拍板\"副标题并升级为时效性通知以穿透专注模式。配置了端到端加密时整包加密，但通知 id 必须留在明文顶层——折叠是服务端写的推送头，它读不到密文里的字段。子代理进程内不发通知，通知只归指挥官会话。\n\n**身份投影**是单向的：会话启动、宿主上报会话信息变化（改名、快捷键、自动命名都已在宿主收口）、选模型、选思考等级四类事件各触发一次同步，把「pi·模型/思考等级」写成外部 agent 副标题，会话名同时写标题和一个自定义 token 供侧边栏行布局引用。请求串行排队避免乱序覆盖，去重以队尾意图为准而非已确认身份——否则 A→B→A 快速切回会把过期的 B 永久留在界面上。只有确认收到成功回执才记为已发布，失败静默并由下一个事件重试。只有真正退出才清空显示；重载、切会话等由新会话的启动事件覆盖。非交互模式和子代理进程内不投影。\n\n**火焰**在工作回合开始时挂到编辑器上方的独立多行槽位，回合结束撤下，动画计时器随组件销毁清理。火焰出现即等待信号，因此同时隐藏宿主的文字版等待提示。审查活跃时审查活动条自带火焰，本模块整体退让避免两团火同烧。所有界面写入都推迟到微任务合并后一次落地，从而排在审查模块的同步写入之后当最终仲裁者——否则审查占用期一个回合结束事件就会无条件把文字提示复显出来。高度按终端行数取约四分之一、钳在 3 到 10 行之间；宽度装不下就逐级降高，实在放不下才整体隐藏。\n\n## 改动指南\n\n预设的恢复语义是刻意的：`session_start` 只回填 `activeName` / `activePreset`，不调 `setModel` / `setActiveTools`。想改成\"完全恢复\"前先想清楚模型已下线、工具已改名时的失败路径。快照 `OriginalState` 的思考等级类型取自 `pi.getThinkingLevel()` 而非配置里的 `Preset[\"thinkingLevel\"]`——会话侧的等级集合比预设可配的多（含 `max`），用窄类型存会丢档位。\n\n`session/stats.ts` 的归属规则必须与 pi 自己的 usage-totals 保持一致，改 `usageAttribution` 前先对齐宿主口径，否则 `/tokens` 会和宿主状态栏对不上账。它扫的是磁盘上全部历史会话，不是当前会话。\n\n`session/bark.ts` 对 `master/state.ts` 是只读旁路：`hasBlockedWorker` 吞掉任何异常并按\"无待拍板\"降级，状态文件的损坏与恢复归 Master 报告，通知不放大故障。加密分支里 `id` 提到密文外是硬要求，挪回密文内折叠就失效。`registerBark` 开头对 `FIRECODE_MASTER_WORKER` 的早退不能删——子代理进程也会加载本插件。\n\n`session/herdr-display.ts` 只写带 `source` 的显示元数据（`display_agent` / `title` / 自定义 token）。不要在这里改 workspace、pane label 或 tab label：那些是持久共享名称，herdr 没有条件 rename 与 CAS 接口，\"先查再改\"消不掉 split/move 竞态。上报的 `seq` 必须单调递增，herdr 靠它丢弃过期上报。改名事件只订阅宿主的 `session_info_changed`，不要从 `session/rename.ts` 直接接线。\n\n`session/working-flame.ts` 必须走 `setWidget` 的 `aboveEditor` 槽位。把多行帧塞进单行 spinner 通道是已经发生过的事故，会与工具输出互相踩踏。`sync()` 的微任务合并同样不能改成同步调用——它保证本模块在同一调度链里最后落地，是\"审查占用期不复显文字提示\"的唯一保证。素材本身来自 `flame-frames.ts`，自带 ANSI 颜色与行尾复位，渲染时只加左侧缩进即可居中，不要再套截断或着色。\n",
  "modules/statusbar.md": "---\nsources:\n  - agent/extensions/firecode/statusbar/index.ts a042a8c55ec6 registerStatusBar reviewStatus fitMetadataLine fitStatusLine\n  - agent/extensions/firecode/statusbar/render.ts 4611e8748c9a StatusLineParts renderLocation renderQuota renderContext renderCache renderTps reviewStatus alignRight fitMetadataLine fitStatusLine latestCacheHitPercent\n  - agent/extensions/firecode/statusbar/quota.ts 1d978210b0e5 registerQuota FRESH_MS BACKOFF_MS REQUEST_TIMEOUT_MS subscriptionProvider grokCliToken loadQuota\n  - agent/extensions/firecode/statusbar/quota-cache.ts 51567221d542 QuotaCache QuotaCacheEntry fileQuotaCache\n  - agent/extensions/firecode/statusbar/quota-parse.ts 1818c49ceebb QuotaStatus QuotaWindow parseOpenAIQuota parseAnthropicQuota parseGrokQuota\n  - agent/extensions/firecode/statusbar/tps.ts 01cead660b89 TpsStatus registerTps\n  - agent/extensions/firecode/theme.ts 485324b650f0 quotaColor contextColor cacheColor thinkingColor\n---\n\n# 状态栏\n\n## 职责\n\n在终端底部常驻两行信息，让用户不离开对话就知道自己在哪、在用什么、还剩多少。\n\n第一行是身份：当前目录名与 Git 分支、会话名，以及处于指挥官模式时的徽标；右端还会挂上对抗性审查的实时进度。第二行是资源：模型名与思考等级（若开了加速档另加标记）、订阅额度余量、上下文占用、缓存命中率、本轮输出速度。\n\n除了显示，这里还负责两件后台工作。一是向供应商查订阅额度余量——只在会话启动、切换模型、每轮结束这三个时机抓，从不定时轮询，结果和失败退避写进一个跨进程的小文件，同时开多个会话时共用一次请求。二是统计生成速度，从请求发出到最后一段输出落定，边生成边给出每秒 token 数，回合结束后改显示总耗时加均速。\n\n窄终端是常态而非异常：两行都有明确的降级阶梯，宁可整段丢弃也不显示半截内容。\n\n## 对外接口\n\n对外只有一个入口 `registerStatusBar(pi)`，由插件总入口按 feature 开关调用；它内部再挂 `registerQuota` 与 `registerTps` 两个采集器，并通过宿主的 footer 接口注册渲染回调。\n\n- `render.ts` 是纯函数层，也是唯一被测试直接消费的接口：`renderLocation` / `renderQuota` / `renderContext` / `renderCache` / `renderTps` 产出各段文本，`reviewStatus` 从宿主的扩展状态表里取 `fire-review` 键，`latestCacheHitPercent` 从会话条目倒查最近一条助手消息的 usage，`fitMetadataLine` / `fitStatusLine` / `alignRight` 负责按宽度取舍。`StatusLineParts` 是第二行的输入契约（每个可压缩段都成对给出完整版与紧凑版）。\n- `quota.ts` 暴露 `registerQuota(pi, update, cache)`：`update` 回调推 `QuotaStatus`，`cache` 是注入的缓存实现，测试因此可以不碰文件系统。\n- `quota-cache.ts` 定义接口 `QuotaCache` 与条目 `QuotaCacheEntry`（windows / nextAttemptAt / failures），生产实现是 `fileQuotaCache(directory)`。\n- `quota-parse.ts` 只做响应解析：`parseOpenAIQuota` / `parseAnthropicQuota` / `parseGrokQuota` 各自把供应商 JSON 压成 `QuotaWindow[]`。\n- `tps.ts` 暴露 `registerTps(pi, update, now?)` 和状态类型 `TpsStatus`，第三个参数是可注入的时钟。\n- 颜色分级不在本模块：`quotaColor` / `contextColor` / `cacheColor` / `thinkingColor` 都来自 `theme.ts`。\n\n## 数据怎么流\n\n渲染是拉取式的：宿主每次重画都会调渲染回调，回调当场从会话上下文取目录、分支、会话名、模型、思考等级、上下文占用和最近一条助手消息，再叠上两个采集器缓存在闭包里的额度与速度，拼成两行返回。采集器拿到新数据时不直接画，只请求宿主重画，真正的取数仍发生在下一次渲染里——所以状态栏没有自己的一份显示状态副本。\n\n宽度取舍分两条独立的阶梯。第一行先试完整拼接，放不下就丢掉徽标（整段丢，不截半个），再按预算截会话名，实在不够就只留位置；审查进度是右对齐挂载的，左右之间凑不出两格空隙就整段不显示。第二行按一张候选顺序表逐个试：先砍速度，再砍模型的加速标记，再把额度压成只显示最紧的那个窗口，接着依次砍额度、缓存、上下文的窗口大小；全部候选都放不下才退到「截断的模型名加上下文」，最后只剩上下文。空的额度、缓存、速度段会在拼接时被自然丢弃。\n\n额度这条链更长一些。触发时先判断当前模型的供应商是否属于订阅制——只有 OpenAI Codex、Anthropic、xAI 三家，且后两家必须确实走 OAuth 登录；不满足就清空显示。然后读缓存：还在新鲜期或退避窗口内就直接用缓存里的窗口值，一次网络都不发。真要发请求时先把退避窗口写回缓存占位，防止同进程内并发叠加；请求带三秒超时，成功后写回窗口值并清零失败计数，失败则累加失败次数并按一分钟、两分钟、五分钟三档退避（末档为上限）。手动触发（会话启动、切模型）会先显示加载态，回合结束的自动刷新则安静进行。xAI 的凭据不走 pi 自己的登录态，而是读官方 CLI 在用户主目录留下的登录文件，并检查过期时间。所有响应解析都容错，取不到就当作没有该窗口。\n\n速度统计以一次请求为周期：请求发出记起点，第一段增量到达记生成起点并立刻显示活跃态，之后每 250 毫秒最多更新一次、且要求已累计一秒样本才给数值，期间优先用宿主给的官方输出 token 数，没有才用字符数除以四估算。助手消息结束时改成完成态，耗时按请求起点算（含首字延迟），速率按纯生成区间算，随后清零等下一次请求。切模型和会话结束都会清空。\n\n## 改动指南\n\n改布局阶梯就是改 `render.ts`，它零 IO、零会话依赖，`tests/layout.test.ts` 已经覆盖 `fitStatusLine` / `fitMetadataLine` / `alignRight` 及各 `renderX`；新增一段信息时记得同时补 `StatusLineParts` 的紧凑版本并把它插进 `fitStatusLine` 的候选表，否则窄屏会直接跳过整行降级逻辑。\n\n带背景的场景禁用 pi-tui 的 `TruncatedText` / `truncateToWidth`，本模块一律用 `format.ts` 的 `clip`（省略号带全量重置会掐断外层背景色）；宽度计算必须走 `visibleWidth`，不能用字符串长度——所有段都含 ANSI 与 emoji。\n\n`fitMetadataLine` 的徽标参数（指挥官状态，来自扩展状态表的 `master` 键）是整段取舍：放不下就丢，不参与截断阶梯。新增同类整段元素时沿用这个约定，不要引入第二种半截显示。\n\n`quota.ts` 里的三个 URL 都是供应商自家 CLI 的内部接口，schema 不是公开契约，会无预警变；解析改动应集中在 `quota-parse.ts` 并保持全部字段容错，`tests/quota.test.ts` 用固定响应样本锁住解析结果。改退避策略要同时看 `BACKOFF_MS` 与写缓存的时机：请求前的那次占位写入是防并发叠加的，删掉它会让同一进程重复打接口。缓存文件按 provider 分文件、临时文件加进程号后 rename 覆盖，跨进程共享靠的就是这条；写失败被有意吞掉，因为缓存只是加速手段。\n\n`tps.ts` 的时钟是注入的，`tests/tps.test.ts` 靠它做确定性断言；不要在内部直接调 `performance.now()`。速率与耗时用的是两个不同区间（生成区间 vs 含首字延迟的整段），改动时别把它们合并。\n",
  "modules/tools.md": "---\nsources:\n  - agent/extensions/firecode/tools/index.ts ab23e4cc43df registerToolRendering executeTimed rangeSuffix lineCount\n  - agent/extensions/firecode/tools/grouping.ts 2afb3a443a91 installGroupPatch uninstallGroupPatch renderFallbackToolRow FIRECODE_TOOLS patchToolRows indexJoinedRows followsToolRow\n  - agent/extensions/firecode/tools/line.ts cd6bca3c9b27 ToolLine makeResultRenderer RowState RenderContext\n  - agent/extensions/firecode/tools/parts.ts 67d1c047aa15 Part paint clipParts pathValue commandParts sizePart durationPart diffMeta genericArgsParts\n  - agent/extensions/firecode/tools/timing.ts 01f73aa80080 executeTimed takeDuration clearDurations\n---\n\n# 工具行渲染\n\n## 职责\n\n把默认四个工具（读取、操作、修改、写入）在聊天记录里的展示压成一行：左边是状态点和中文标签，中间是这次干了什么（路径或命令），右边贴耗时和结果体积。宽度不够时按语义方向截断——路径丢开头保文件名，命令丢结尾保命令词；再窄就先扔掉右侧那两列，最后只剩状态点和标签。整行带底色，运行中、成功、失败三种底色区分状态。\n\n连续的工具调用被合并成一条视觉轨道：每条行本来自带一个前导空行做间隔，紧跟在另一条工具行后面的行会把这个空行去掉，一串调用就连成一片而不是被空行切碎。\n\n除了自己接管的四个工具，这里还兜住所有第三方工具：没被认领的工具行会被换成同样格式的通用单行，避免别的扩展按默认宽卡片渲染破坏轨道的整齐。展开某一行时回到完整输出，不做压缩。\n\n只接管默认激活的四个工具是刻意的：宿主注册工具即等于激活，给检索类工具挂渲染包装会把它们在所有会话强行打开，渲染层不允许改变工具集。\n\n## 对外接口\n\n`tools/index.ts` 的 `registerToolRendering(pi)` 是唯一入口：它重新注册 read/bash/edit/write 四个工具（复用宿主原始实现，只换 label、`renderShell: \"self\"` 和渲染函数），在 `session_start` 装轨道 patch、`session_shutdown` 卸载，并提供 `/tool-status` 命令打印当前已加载与已启用的工具名。\n\n`tools/line.ts` 导出可复用的渲染件：`ToolLine` 是行组件本体，`makeResultRenderer(sized)` 生成结果渲染器，`RowState` 与 `RenderContext` 是 renderCall 与 renderResult 之间共享的行状态与上下文类型。Master 模块直接用 `ToolLine` 画自己的工具行，不经 `tools/index.ts`。\n\n`tools/parts.ts` 是着色片段层：`Part` 是带颜色的文本片段，`paint` 上色、`clipParts` 按方向截断，`pathValue`/`commandParts` 构造路径与命令主体，`sizePart`/`durationPart` 构造右侧列，`diffMeta` 从 diff 文本数出增删行，`genericArgsParts` 为未知工具挑一个有代表性的参数展示。\n\n`tools/timing.ts` 是耗时旁路：`executeTimed` 包住执行、`takeDuration` 按调用 id 取走一次、`clearDurations` 清空。\n\n`tools/grouping.ts` 对外只暴露 `installGroupPatch(ui, decorated)` / `uninstallGroupPatch()` 一对生命周期函数，外加 `renderFallbackToolRow` 通用兜底行与 `FIRECODE_TOOLS`（走宿主原生渲染的工具名集合）。\n\n## 数据怎么流\n\n一次工具调用有两个信息源，在同一行上汇合。调用参数在发起时就能画：路径被折成 `./` 或 `~` 前缀、目录暗色文件名亮色，读取还会把偏移和行数折成 `:12-40` 这样的尾缀；命令被压成一行、命令词高亮、管道重定向和环境变量赋值压暗。结果要等执行完：结果字符数和真实执行耗时回填到行状态，右侧列才出现；修改工具额外从结果里数出增删行数贴在路径后面，写入工具则直接从待写内容数行数。失败时整行转红，并在主体后面挤一段错误摘要——此时主体被压到可用宽度的四成左右，把位置让给错误原因。\n\n耗时不能在渲染时测，因为渲染只看得到结果。所以执行被包了一层计时，按调用 id 存进一张表，渲染侧取一次即删除，长会话不会堆积；会话开始和结束都会清空这张表。\n\n轨道合并要知道\"上一条也是工具行\"，这信息只在宿主的组件树里。做法是借一次 widget 生命周期拿到 TUI 实例，然后在它的重绘入口挂钩：每次重绘先尝试找到聊天容器、从里面任取一条工具行、patch 它的原型渲染方法。patch 后的渲染先判断这个工具该走原生渲染还是通用兜底行，再判断自己是否紧跟另一条工具行，是就砍掉首行空行。相邻关系是增量算的——聊天记录只增不改，所以从上次算到的位置续算，结果存在弱引用集合里。patch 状态挂在全局符号上，扩展热重载重新执行模块后仍能正确卸载；卸载时逐个校验当前函数确实是自己装的那个才还原。\n\n## 改动指南\n\n`tools/grouping.ts` 是全仓与宿主耦合最紧的一处：它依赖 pi 内部组件树的形状（`children` 数组、工具行同时具备 `toolName`/`render`/`setExpanded`）和原型 patch。升级 pi 时优先跑这里的验证。patch 失败只会 notify 一次警告并继续走原始渲染，不会崩会话，所以故障表现是\"轨道回到空行分隔\"而不是报错——排查连行问题先看有没有那条警告。\n\n改工具集合要动 `FIRECODE_TOOLS`：不在集合里的工具会被通用兜底行覆盖，自带中文行渲染的工具（如 subagents）必须列进去，否则自渲染会被兜底行遮掉。反过来，**不要**给 grep/find/ls 加渲染包装——宿主注册即激活，包装等于强制在所有会话打开这三个工具。\n\n带背景的行禁用 pi-tui 的截断工具：其省略号带全量重置序列，会在截断点掐断外层背景色。单行截断一律走 `format.ts` 的 `clip`，`clipParts` 内部也是基于它。\n\n右侧列是可牺牲的：主体宽度低于下限时会从右往左弹出耗时和体积列，改这里的阈值要连带确认窄终端下不会出现主体只剩一个字符的情况。\n\n耗时表按调用 id 取一次即删，若新增读取点必须自己缓存，第二次取会拿到 undefined。\n\n测试在 `tests/tools.test.ts`，经 `tests/loader.ts` 复制插件目录并改写 pi 依赖后运行时加载；它覆盖的是紧凑行渲染与\"只合并相邻工具行\"这一条核心行为。\n"
 }

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function inline(s) {

  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");

  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, u) =>

  return s;
}
function mdRender(text) {
  const body = text.replace(/^---\n[\s\S]*?\n---\n?/, "");
  const lines = body.split("\n"), out = [];
  let i = 0, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  while (i < lines.length) {
    const L = lines[i];

      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);

    }
    const h = L.match(/^(#{1,4})\s+(.*)/);
    if (h) { flush(); out.push(`<h${h[1].length} data-h="${esc(h[2].trim())}">${inline(h[2])}</h${h[1].length}>`); i++; continue; }

nav.addEventListener("mouseout", e => {
  const to = e.relatedTarget?.closest?.(".item")?.dataset.code;
  if (to === navHover) return;
  navHover = null;
  if (typeof sel !== "number") { focusSet(baseFocus()); buildEdges(); }
});

/* ── 面板：页面（wiki md 直渲）/ 关系（图数据派生）── */
let tab = "page", sel = null;
const panel = document.getElementById("panel");
const tabPage = document.getElementById("tabPage"), tabRel = document.getElementById("tabRel");
function srcList(a) {
  if (!a?.length) return "";
  const repo = DATA.meta.repoUrl;
  return `<h3>出处</h3><ul>` + a.map(s =>
    repo ? `<li>${ic("file", 11)} <a class="src" target="_blank" href="${repo}/${s}"><code>${s}</code></a></li>`
         : `<li class="src" data-path="${s}">${ic("file", 11)} <code>${s}</code></li>`).join("") + "</ul>";
}
const kicker = (icn, label, color) =>
  `<div class="kicker" ${color ? `style="color:${color}"` : ""}>${ic(icn)}<span>${label}</span></div>`;
const chips = arr => arr.length ? `<div class="chips">${arr.join("")}</div>` : `<p class="dimtext">无</p>`;
const nodeChip = (code, extra) =>
  `<span class="chip" data-code="${code}">${N[code].short || N[code].name}${extra ? " · " + extra : ""}</span>`;
function flowRefs(code) {
  const out = [];
  FLOWS.forEach((f, fi) => f.steps.forEach((s, si) => {
    if (s.from === code || s.to === code)
      out.push(`<span class="chip" data-flow="${fi}" data-step="${si}">${f.title} · ${si + 1}. ${s.title}</span>`);
  }));
  return out;
}
function pageBody(pageRef) {
  const page = pageRef?.split("#")[0];
  return page && WIKI[page] ? mdRender(WIKI[page]) : "";
}
function systemPanel() {
  const m = DATA.meta;
  if (tab === "page")
    return kicker("globe", "系统") + `<h2>${m.headline}</h2>` +
      (pageBody("system.md") || "");
  return kicker("globe", "系统") + `<h2>怎么读这张图</h2>${m.reading}
    <h3>场景</h3>` + chips(FLOWS.map((f, i) =>
      `<span class="chip" data-flow="${i}" data-step="0">${f.title} · ${f.steps.length} 步</span>`)) +
    srcList(m.sources);
}
function nodePanel(code) {
  const n = N[code], d = DIST[n.district];
  const head = kicker(n.icon || d.icon, d.label, mix(tintOf[d.id], 55, "var(--ink)")) + `<h2>${n.name}</h2>` +
    (n.count ? `<p class="dimtext">群组节点 · 汇聚 ${n.count} 个同类模块为一栋</p>` : "");
  if (tab === "page") {
    const body = pageBody(n.page);
    return head + (body || `<p class="dimtext">未关联 wiki 页。</p>`);
  }
  const up = DATA.links.filter(l => l.to === code).map(l => nodeChip(l.from, l.label));
  const down = DATA.links.filter(l => l.from === code).map(l => nodeChip(l.to, l.label));
  return head +
    `<h3>上游 · 谁依赖它</h3>` + chips(up) +
    `<h3>下游 · 它依赖谁</h3>` + chips(down) +
    `<h3>参与场景</h3>` + chips(flowRefs(code)) +
    srcList(n.sources);
}
function pageTitle(pageRef) {
  const page = pageRef.split("#")[0];
  const m = (WIKI[page] || "").replace(/^---\n[\s\S]*?\n---\n?/, "").match(/^#\s+(.+)$/m);
  return m ? m[1] : page.replace(/\.md$/, "");
}
function wikiPanel() {
  return kicker("book", "WIKI") + `<h2>${pageTitle(sel.page)}</h2>` +
    (pageBody(sel.page) || `<p class="dimtext">页面不存在：${esc(sel.page)}</p>`);
}
function scenarioPanel(fi) {
  const F = FLOWS[fi];
  const head = kicker("play", "场景") + `<h2>${F.title}</h2>`;
  const steps = `<ul class="steps">${F.steps.map((s, j) =>
    `<li data-step="${j}">${j + 1}. ${s.title}</li>`).join("")}</ul>`;
  if (tab === "page") {
    const body = pageBody(F.page || "data-flow.md");
    return head + (body || `<h3>步骤（可点击播放）</h3>` + steps);
  }
  const route = [...new Set(F.steps.flatMap(s => [s.from, s.to]))];
  return head +
    `<h3>入口</h3>` + chips([nodeChip(F.steps[0].from)]) +
    `<h3>途经模块</h3>` + chips(route.map(c => nodeChip(c))) +
    `<h3>步骤（可点击播放）</h3>` + steps;
}
function linkPanel(i) {
  const l = DATA.links[i];
  return kicker("gateway", "结构关系") + `<h2>${l.label}</h2>
    <p>${l.what || ""}</p><p><code>${N[l.from].name}</code> → <code>${N[l.to].name}</code></p>
    ${srcList([...(N[l.from].sources || []).slice(0, 1), ...(N[l.to].sources || []).slice(0, 1)])}`;
}
function flowPanel(i) {
  const F = FLOWS[activeFlow], f = F.steps[i];
  const list = F.steps.map((s, j) =>
    `<li class="${j < i ? "done" : j === i ? "now" : ""}" data-step="${j}">${j + 1}. ${s.title}</li>`).join("");
  return kicker("play", F.title) + `<h2>第 ${i + 1}/${F.steps.length} 步 · ${f.title}</h2>
    <p>${f.what}</p><p><code>${N[f.from].name}</code> → <code>${N[f.to].name}</code></p>
    ${srcList(f.sources || [...(N[f.from].sources || []).slice(0, 1), ...(N[f.to].sources || []).slice(0, 1)])}
    <h3>全部步骤（可点击）</h3><ul class="steps">${list}</ul>`;
}
function scrollToAnchor(pageRef) {
  const anchor = pageRef?.split("#")[1];
  if (!anchor) { panel.scrollTop = 0; return; }
  const h = [...panel.querySelectorAll("[data-h]")].find(e => e.dataset.h === anchor);
  if (h) h.scrollIntoView({ block: "start" });
}
function render() {
  panel.innerHTML =
    sel == null ? systemPanel() :
    typeof sel === "number" ? flowPanel(sel) :
    typeof sel === "object" ? (sel.flow != null ? scenarioPanel(sel.flow) : wikiPanel()) :
    sel.startsWith("L") ? linkPanel(+sel.slice(1)) : nodePanel(sel);
  document.querySelectorAll("nav .item").forEach(e => {
    e.classList.toggle("sel", e.dataset.code === sel);
    e.classList.remove("dm");
  });
  panel.querySelectorAll(".steps li").forEach(li =>
    li.addEventListener("click", () => { pauseAuto(); showStep(+li.dataset.step); }));
  panel.querySelectorAll("li.src").forEach(li =>
    li.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(li.dataset.path); } catch {}
      const c = li.querySelector("code"), t = c.textContent;
      c.textContent = "已复制 ✓"; setTimeout(() => c.textContent = t, 900);
    }));
  panel.querySelectorAll(".chip[data-code]").forEach(ch =>
    ch.addEventListener("click", () => select(ch.dataset.code)));
  panel.querySelectorAll(".chip[data-flow]").forEach(ch =>
    ch.addEventListener("click", () => showScenarioStep(+ch.dataset.flow, +ch.dataset.step)));
  panel.querySelectorAll("a.wl").forEach(a =>
    a.addEventListener("click", () => {
      const cur = (sel && typeof sel === "object" && (sel.page || FLOWS[sel.flow]?.page)) ||
        (typeof sel === "string" && !sel.startsWith("L") && N[sel]?.page) || "index.md";
      const target = resolvePage(cur.split("#")[0], a.dataset.href);
      openWikiPage(target, a.dataset.href.split("#")[1]);
    }));
  if (typeof sel === "object" && sel) scrollToAnchor(sel.flow != null ? FLOWS[sel.flow].page : sel.page);
  else if (typeof sel === "string" && !sel.startsWith("L") && tab === "page") scrollToAnchor(N[sel]?.page);
}
tabPage.onclick = () => { tab = "page"; tabPage.classList.add("on"); tabRel.classList.remove("on"); render(); };
tabRel.onclick = () => { tab = "rel"; tabRel.classList.add("on"); tabPage.classList.remove("on"); render(); };

/* ── 聚焦 ── */
function focusSet(set) {
  for (const [c, g] of Object.entries(nodeEls)) g.classList.toggle("dim", !!set && !set.has(c));
  for (const g of gPlate.children) g.classList.toggle("dim", !!set && !set.has(g.dataset.code));
  for (const g of [...gLink.children, ...gFlow.children]) {
    const [a, b] = g.dataset.n.split(" ");
    g.classList.toggle("dim", !!set && !(set.has(a) && set.has(b)));
  }
}
const hood = code => new Set([code, ...(adj[code] || [])]);
function markSel(code) {
  gSel.innerHTML = "";
  if (!code) return;
  const n = N[code];
  el("polygon", { id: "selring", points: P([
    iso(n.x - .35, n.y - .35), iso(n.x + n.w + .35, n.y - .35),
    iso(n.x + n.w + .35, n.y + n.d + .35), iso(n.x - .35, n.y + n.d + .35)]),
    fill: "none", stroke: "var(--accent)", "stroke-width": 2 }, gSel);
}
function hopNode(code) {
  const g = nodeEls[code];
  if (!g) return;
  g.classList.remove("hop"); g.getBBox(); g.classList.add("hop");
  g.addEventListener("animationend", () => g.classList.remove("hop"), { once: true });
}
function baseFocus() {
  if (typeof sel === "string" && !sel.startsWith("L")) return hood(sel);
  if (sel && typeof sel === "object" && sel.flow != null)
    return new Set(FLOWS[sel.flow].steps.flatMap(s => [s.from, s.to]));
  return null;
}
function select(code) {
  stopFlowVisual(); sel = code;
  if (code == null && activeFlow >= 0) { activeFlow = -1; syncFlowbar(); }  // 点空白回总览
  const isNode = typeof code === "string" && !code.startsWith("L");
  buildEdges();
  markSel(isNode ? code : null);
  focusSet(isNode ? hood(code) : null);
  if (isNode) hopNode(code);
  render();
}
/* 打开 wiki 页时同步地图：模块页→点亮对应楼；场景小节→激活对应路线；跨模块页→不选中 */
function openWikiPage(target, anchor) {
  const ref = target + (anchor ? "#" + anchor : "");
  const fi = FLOWS.findIndex(f => f.page && f.page.split("#")[0] === target &&
    anchor && f.page.split("#")[1] === anchor);
  if (fi >= 0) {
    stopFlowVisual(); activeFlow = fi; syncFlowbar();
    sel = { flow: fi }; markSel(null); buildEdges(stepsOf(fi));
    focusSet(new Set(FLOWS[fi].steps.flatMap(s => [s.from, s.to])));
    render(); return;
  }
  const matches = DATA.nodes.filter(n => (n.page || "").split("#")[0] === target);
  if (matches.length === 1) {
    select(matches[0].code);
    if (anchor) scrollToAnchor(ref);
    return;
  }
  sel = { page: ref }; markSel(null); render();
  let set = null;
  if (matches.length) set = new Set(matches.map(n => n.code));
  else {
    const fs = FLOWS.filter(f => (f.page || "").split("#")[0] === target);
    if (fs.length) set = new Set(fs.flatMap(f => f.steps.flatMap(s => [s.from, s.to])));
  }
  focusSet(set); navDim(set);
}
function navDim(set) {
  document.querySelectorAll("nav .item").forEach(e =>
    e.classList.toggle("dm", !!set && !set.has(e.dataset.code)));
}
function bindNode(g) {
  const code = g.dataset.code;
  g.addEventListener("mouseenter", () => {
    if (typeof sel !== "number") {
      focusSet(hood(code)); buildEdges(stepsFor(code));
      if (sel == null) panel.innerHTML = nodePanel(code);
    }
  });
  g.addEventListener("mouseleave", () => {
    if (typeof sel !== "number") {
      focusSet(baseFocus()); buildEdges();
      if (sel == null) render();
    }
  });
  g.addEventListener("click", e => { e.stopPropagation(); select(code); });
}
Object.values(nodeEls).forEach(bindNode);
[...gPlate.children].forEach(bindNode);

/* ── 流程追踪 ── */
let auto = null, stepIdx = -1;
function showStep(i) {
  stepIdx = i; sel = i; markSel(null); render();
  flowEls.forEach(({ p, glow }, j) => {
    p.setAttribute("stroke", j === i ? "var(--accent)" : "var(--ink)");
    p.setAttribute("stroke-width", j === i ? 2.6 : j < i ? 2 : 1.6);
    p.setAttribute("marker-end", j === i ? "url(#arrA)" : "url(#arr)");
    p.setAttribute("opacity", j <= i ? 1 : .35);
    glow.setAttribute("opacity", j === i ? .22 : 0);
  });
  const f = FLOWS[activeFlow].steps[i];
  focusSet(new Set([f.from, f.to]));
  hopNode(f.to);
  gStreak.style.display = "none";
  if (playPulse) playPulse.remove();
  const p = flowEls[i].p, len = p.getTotalLength(), t0 = performance.now(), dur = motionOK ? 340 : 0;
  playPulse = el("path", { d: p.getAttribute("d"), stroke: "#FFFFFF", "stroke-width": 3,
    fill: "none", "stroke-linecap": "round", opacity: .95,
    "stroke-dasharray": `22 ${(len + 22).toFixed(1)}`, "stroke-dashoffset": 22 }, gTag);
  (function anim(now) {
    const k = dur ? Math.min((now - t0) / dur, 1) : 1;
    playPulse.setAttribute("stroke-dashoffset", (22 - k * (len + 22)).toFixed(1));
    if (k < 1 && stepIdx === i) requestAnimationFrame(anim);
  })(t0);
}
function pauseAuto() { if (auto) clearTimeout(auto); auto = null; }
function stopFlowVisual() {
  pauseAuto(); stepIdx = -1;
  if (playPulse) { playPulse.remove(); playPulse = null; }
  gStreak.style.display = "";
  flowEls.forEach(({ p, glow }) => { p.setAttribute("stroke", "var(--ink)");
    p.setAttribute("stroke-width", 1.6); p.setAttribute("marker-end", "url(#arr)");
    p.setAttribute("opacity", 1); glow.setAttribute("opacity", 0); });
}
document.getElementById("btnPlay").onclick = () => {
  if (activeFlow < 0) { activeFlow = 0; syncFlowbar(); }
  stopFlowVisual(); buildEdges(stepsOf(activeFlow)); showStep(0);
  const steps = FLOWS[activeFlow]?.steps || [];
  const tick = () => {
    if (stepIdx + 1 >= steps.length) { auto = null; return; }
    showStep(stepIdx + 1);
    auto = setTimeout(tick, motionOK ? 620 : 400);
  };
  auto = setTimeout(tick, motionOK ? 620 : 400);
};
document.getElementById("btnStep").onclick = () => {
  if (activeFlow < 0) { activeFlow = 0; syncFlowbar(); buildEdges(stepsOf(0)); }
  pauseAuto(); showStep((stepIdx + 1) % (FLOWS[activeFlow]?.steps.length || 1));
};

/* ── 取景 / 平移缩放 / 响应式 ── */
const stage = document.getElementById("stage");
function fitHome() {
  const boxes = [gDist.getBBox(), gNode.getBBox(), gPlate.getBBox(), gTag.getBBox()];
  const x = Math.min(...boxes.map(b => b.x)) - 18, y = Math.min(...boxes.map(b => b.y)) - 16;
  return { x, y,
    w: Math.max(...boxes.map(b => b.x + b.width)) + 18 - x,
    h: Math.max(...boxes.map(b => b.y + b.height)) + 16 - y };
}
const HOME = fitHome();
let vb = { ...HOME }, homeView = true;
const applyVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
document.getElementById("btnReset").onclick = () => { stopFlowVisual(); select(null); vb = { ...HOME }; homeView = true; applyVB(); };
new ResizeObserver(() => { if (homeView) applyVB(); }).observe(stage);
let pan = null, moved = false;
stage.addEventListener("pointerdown", e => {
  if (e.target.closest(".b") || e.target.closest(".lk") || e.target.closest("#flowbar")) return;
  pan = { px: e.clientX, py: e.clientY, x: vb.x, y: vb.y }; moved = false;
  stage.classList.add("panning"); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!pan) return;
  if (Math.hypot(e.clientX - pan.px, e.clientY - pan.py) > 3) moved = true;
  const k = vb.w / stage.clientWidth;
  vb.x = pan.x - (e.clientX - pan.px) * k; vb.y = pan.y - (e.clientY - pan.py) * k;
  if (moved) { homeView = false; applyVB(); }
});
stage.addEventListener("pointerup", e => {
  const wasPan = pan; pan = null; stage.classList.remove("panning");
  if (wasPan && !moved && !e.target.closest(".b") && !e.target.closest(".lk") && !e.target.closest("#flowbar")) select(null);
});
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const r = svg.getBoundingClientRect();
  const mx = vb.x + (e.clientX - r.left) / r.width * vb.w;
  const my = vb.y + (e.clientY - r.top) / r.height * vb.h;
  vb = { x: mx - (mx - vb.x) * k, y: my - (my - vb.y) * k, w: vb.w * k, h: vb.h * k };
  homeView = false; applyVB();
}, { passive: false });

applyVB();
render();
</script>
</body>
</html>
